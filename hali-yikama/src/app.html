<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B0122C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halı Yıkama">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Halı Yıkama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap">
<style>
:root{--bg:#FBF3EA;--card:#fff;--ink:#2B1216;--mute:#6B4D51;--line:#EEDACB;--acc:#B0122C;--on:#fff;--seg:#F7E7DA;--edge:#E6C2AE;--ok:#0B8577;--bad:#C2410C;--tq:#0E9A94;--tqd:#0A7A75;--gold:#F2B33D;--hd1:#B0122C;--hd2:#7A0C1F;--font:Manrope,system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170B0E;--card:#24141A;--ink:#FBEFEA;--mute:#C9AEAB;--line:#3D252B;--acc:#FF5A6E;--on:#2A0509;--seg:#2E1A20;--edge:#55343B;--ok:#3FD1C1;--bad:#FF8A4C;--tq:#3FD1C1;--tqd:#10766F;--gold:#F5BE55;--hd1:#9A1028;--hd2:#5C0815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#170B0E;--card:#24141A;--ink:#FBEFEA;--mute:#C9AEAB;--line:#3D252B;--acc:#FF5A6E;--on:#2A0509;--seg:#2E1A20;--edge:#55343B;--ok:#3FD1C1;--bad:#FF8A4C;--tq:#3FD1C1;--tqd:#10766F;--gold:#F5BE55;--hd1:#9A1028;--hd2:#5C0815;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--acc)}
.pole{height:10px;background:linear-gradient(135deg,var(--tq) 25%,transparent 25%) -6px 0/12px 10px,linear-gradient(225deg,var(--tq) 25%,transparent 25%) -6px 0/12px 10px,linear-gradient(315deg,var(--gold) 25%,transparent 25%) 0 0/12px 10px,linear-gradient(45deg,var(--gold) 25%,transparent 25%) 0 0/12px 10px,var(--hd2)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
header{margin:0 0 16px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 18px -8px rgba(122,12,31,.55);border-bottom:4px solid var(--gold)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:54px;height:54px;flex:none;background:#fff;border:2px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:#B0122C}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#FFD47E}
h1{font-size:23px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:rgba(255,255,255,.88)}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:80px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs[hidden]{display:none!important}
.tabs{display:flex;gap:2px;background:var(--seg);border:1px solid var(--edge);border-radius:12px;padding:3px;margin-bottom:16px}
.tabs.stick{position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--bg)}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700;font-size:clamp(12px,3.6vw,15px);padding:11px 2px;border-radius:9px;cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on);box-shadow:0 2px 6px -2px rgba(122,12,31,.5)}
.card{background:var(--card);border:1px solid var(--edge);border-top:3px solid var(--tq);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:700;margin:0 0 6px;color:var(--acc)}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.go{width:100%;margin-top:18px;border:0;background:var(--acc);color:var(--on);box-shadow:0 4px 12px -4px rgba(122,12,31,.55);font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:12px;cursor:pointer;min-height:52px}
.go:disabled,.btn2:disabled{opacity:.6}
.btn2{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.btn2.main{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn2.bad{color:var(--bad);border-color:var(--bad)}
.btn2.sm{min-height:34px;padding:3px 10px;font-size:13px;margin-left:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--edge);border-left:4px solid var(--tq);border-radius:12px;padding:14px 12px}
.stat span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.stat b{display:block;color:var(--acc);font-size:21px;line-height:1.1;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.mute{color:var(--mute)}.empty{color:var(--mute);padding:6px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--tqd);border:1px solid var(--tqd);border-radius:99px;padding:2px 10px;white-space:nowrap}
.steps{display:flex;gap:4px;margin:12px 0 10px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:linear-gradient(90deg,var(--acc),var(--tq))}
.pay{font-size:14px;font-weight:700;text-align:right}.pay.no{color:var(--bad)}.pay.yes{color:var(--ok)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}.total b{font-size:24px;color:var(--acc)}
.panel{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts>*{flex:1 1 auto}
.fl{flex:1 1 130px;min-width:0}
.okc{border-color:var(--ok);border-top-color:var(--ok)}.badc{border-color:var(--bad);border-top-color:var(--bad)}
.qr{background:#fff;border-radius:12px;padding:10px;max-width:260px;margin:12px auto 4px}
.qr svg{display:block;width:100%;height:auto}
.big{font-size:28px;font-weight:700;color:var(--acc)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:688px;margin:auto;background:var(--ink);color:var(--bg);padding:13px 15px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.show{opacity:1}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{body{background:#fff}.noprint,#tabs,header,.pole{display:none!important}.card{border:0}}
</style>
</head>
<body>
<div class="pole"></div>
<div class="wrap">
<header><div class="brand">
<div class="logo" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="24" height="20" rx="2"/><path d="M17 11l6 6-6 6-6-6z"/><path d="M5 30v2M9 30v2M13 30v2M17 30v2M21 30v2M25 30v2M29 30v2"/></svg></div>
<div><div class="eyebrow" id="eyebrow">Halı yıkama</div><h1 id="baslik">Halı Yıkama</h1><div class="sub" id="slogan">Halını al, yıka, kapına getir</div></div>
</div></header>
<div class="tabs stick" id="tabs" role="group" aria-label="Bölümler" hidden></div>
<div id="view"><div class="card empty">Yükleniyor…</div></div>
<noscript><div class="card">Bu sayfa için tarayıcıda JavaScript açık olmalı.</div></noscript>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*__QR__*/
</script>
<script>
'use strict';
var P=location.pathname.split('/').filter(Boolean),AREA=P[0],KOD=String(P[1]||'').toLowerCase();
var NAMES=["Talep alındı","Halı alındı","Yıkanıyor","Kuruyor","Hazır","Teslim edildi"],LAST=5;
var MSG=["Talebiniz alındı, sizi arayacağız.","Halılarınızı teslim aldık, yıkamaya hazırlıyoruz.","Halılarınız yıkanıyor.","Halılarınız kuruyor.","Halılarınız hazır! Size ne zaman getirelim? Uygun saati yazar mısınız?","Halılarınız teslim edildi, teşekkürler."];
var ERR={wrong_pin:'PIN yanlış.',too_many:'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.',network:'İnternet bağlantısı yok gibi. Tekrar deneyin.',no_name:'Adı yazın.',bad_phone:'Telefon numarasını 05xx ile başlayarak yazın.',bad_count:'Halı sayısını yazın.',bad_size:'Ölçüyü sayı olarak yazın. Örn. 3 ve 2',no_rugs:'En az bir halı ekleyin.',no_measure:'Önce ölçüyü kaydedin.',bad_amount:'Tutarı sayı olarak yazın.',too_much:'Yazdığınız tutar kalan tutardan fazla.',changed:'Bu sipariş başka bir telefondan değişti. Liste yenilendi.',yonetici:'Bu işlem için yönetici girişi gerekir.',bad_pin:'PIN 4-8 rakam olmalı.',same_pin:'Yönetici ve personel PIN’i aynı olamaz. Başka bir PIN seçin.',bad_types:'Her tür için ad ve fiyat yazın.',bad_query:'Telefon numaranızı ya da sipariş numaranızı yazın.',order_not_found:'Sipariş bulunamadı. Liste yenilendi.',server:'Bir sorun oldu. Tekrar deneyin.'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Math.round(n).toLocaleString('tr-TR')+' TL'}
function sayi(v){return parseFloat(String(v).replace(',','.'))}
function rakam(s){return String(s||'').replace(/\D/g,'')}
function fd(d){return String(d||'').split('-').reverse().join('.')}
function toast(t){var e=$('toast');e.textContent=t;e.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){e.className=''},4500)}
function olcu(o){var m=0;o.rugs.forEach(function(r){m+=r.m2*r.n});return Math.round(m*100)/100}
function tut(o){var t=0;o.rugs.forEach(function(r){t+=r.m2*r.n*r.bf});return Math.round(t*100)/100}
function adet(o){var n=0;o.rugs.forEach(function(r){n+=r.n});return n}
function odenen(o){var s=0;(o.od||[]).forEach(function(p){s+=p.tut});return s}
function kalan(o){return Math.max(0,Math.round((tut(o)-odenen(o))*100)/100)}
function turad(o){var s=[];o.rugs.forEach(function(r){if(s.indexOf(r.t)<0)s.push(r.t)});return s.join(', ')}
function nor(tel){var d=rakam(tel);if(d.length==11&&d[0]=='0')d='90'+d.slice(1);else if(d.length==10)d='90'+d;return d}
function wa(tel,msg){return 'https://wa.me/'+nor(tel)+'?text='+encodeURIComponent(msg)}
function steps(a){var s='';for(var i=0;i<=LAST;i++)s+='<i class="'+(i<=a?'on':'')+'"></i>';return '<div class="steps" aria-hidden="true">'+s+'</div>'}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function sstore(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function setHead(ad,eyebrow,slogan){$('baslik').textContent=ad||'Halı Yıkama';document.title=ad||'Halı Yıkama';if(eyebrow)$('eyebrow').textContent=eyebrow;if(slogan!==undefined)$('slogan').textContent=slogan}
function link(t){return location.origin+'/'+t+'/'+KOD}
function addManifest(){var l=document.createElement('link');l.rel='manifest';l.href='/'+AREA+'/'+KOD+'/app.webmanifest';document.head.appendChild(l)}

// Ekran yeniden çizilince yazılan yazılar kaybolmasın
var VIEW_RESET=false;
function paint(html){
 var v=$('view'),keep={},act=document.activeElement,fid=act&&act.id,sel=null;
 if(!VIEW_RESET)v.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(e){if(!e.readOnly&&e.type!=='password')keep[e.id]=e.value});
 try{if(fid&&act.selectionStart!=null)sel=[act.selectionStart,act.selectionEnd]}catch(e){}
 v.innerHTML=html;VIEW_RESET=false;
 Object.keys(keep).forEach(function(id){var e=$(id);if(e&&!e.hasAttribute('data-fresh'))e.value=keep[id]});
 if(fid&&$(fid)&&v.contains($(fid))){var f=$(fid);f.focus();try{if(sel)f.setSelectionRange(sel[0],sel[1])}catch(e){}}
}

async function api(path,body,tok){
 var h={};if(body!==undefined)h['content-type']='application/json';if(tok)h.authorization='Bearer '+tok;
 // Zayıf bağlantıda sonsuza kadar beklemesin: 20 saniyede vazgeç
 var ac=typeof AbortController!='undefined'?new AbortController():null,to=ac?setTimeout(function(){ac.abort()},20000):0;
 var r;try{r=await fetch('/api/'+AREA+'/'+KOD+'/'+path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:ac?ac.signal:undefined})}catch(e){clearTimeout(to);return{status:0,d:{error:'network'}}}
 clearTimeout(to);
 var d={};try{d=await r.json()}catch(e){}
 return{status:r.status,d:d}
}
function errText(d){var t=ERR[d&&d.error]||ERR.server;if(d&&d.error=='too_much'&&d.kalan!=null)t+=' Kalan: '+fmt(d.kalan);return t}

var SAAT=['Yarın sabah (09–12)','Yarın öğleden sonra (13–17)','Bu hafta sonu','Aradığımda söyleyeceğim'];
function saatOpt(){return SAAT.map(function(s){return '<option>'+esc(s)+'</option>'}).join('')}

function kapali(d){
 // Abonelik bitti ya da durduruldu
 if(AREA=='r')return '<div class="card badc"><h2>Online talep şu an kapalı</h2><div class="sub">'+esc(d.ad||'Halıcı')+' şu anda internetten talep almıyor. Lütfen telefonla ulaşın.</div>'+(d.tel?'<div class="acts"><a class="btn2 main" href="tel:'+esc(rakam(d.tel))+'">Ara: '+esc(d.tel)+'</a></div>':'')+'</div>';
 return '<div class="card badc"><h2>Aboneliğiniz sona erdi</h2><div class="sub">Uygulamayı kullanmaya devam etmek için lütfen ödemenizi yapın. Kayıtlarınız güvende, ödeme sonrası hemen açılır.</div>'+(d.wa?'<div class="acts"><a class="btn2 main" target="_blank" rel="noopener" href="'+esc(wa(d.wa,'Merhaba, '+(d.ad||'')+' halı yıkama aboneliğim hakkında yazıyorum.'))+'">WhatsApp’tan yazın</a></div>':'')+'</div>'}
function genelHata(st,d){
 if(st==402)return kapali(d);
 if(st==409&&d.error=='setup')return '<div class="card"><h2>Hazırlanıyor</h2><div class="sub">'+esc(d.ad||'Bu halıcı')+' için uygulama henüz kurulmadı. '+(AREA=='s'?'Giriş PIN’lerinin sahip panelinden belirlenmesi gerekiyor.':'Lütfen daha sonra tekrar deneyin.')+'</div></div>';
 if(st==404)return '<div class="card"><h2>Halıcı bulunamadı</h2><div class="sub">Bu link geçersiz. Halıcınızdan doğru linki isteyin.</div></div>';
 return '<div class="card"><h2>Bağlanılamadı</h2><div class="sub">'+esc(errText(d))+'</div><button class="go" onclick="location.reload()">Tekrar dene</button></div>'}

/* ================= MÜŞTERİ SAYFASI (/r/<kod>) ================= */
var C={info:null,sorgu:'',sonuc:null,son:null,busy:false};
function cKart(o){
 return '<div class="card"><div class="top"><b>Sipariş #'+o.no+'</b><span class="chip">'+esc(o.asama)+'</span></div>'+steps(o.a)+'<div>'+esc(o.msg)+'</div>'+(o.saat?'<div class="sub">Gelme zamanı: '+esc(o.saat)+'</div>':'')
 +'<div class="sub" style="margin-top:6px">'+o.adet+' halı'+(o.olcu?' · '+o.olcu+' m²':'')+'</div>'
 +(o.olcu?'<div style="margin-top:6px">Tutar: <b>'+fmt(o.tutar)+'</b> · '+(o.kalan<=0?'<span style="color:var(--ok);font-weight:700">Ödendi</span>':'Kalan: <b>'+fmt(o.kalan)+'</b>')+'</div>':'<div class="sub" style="margin-top:6px">Tutar, halılarınız ölçülünce belli olur.</div>')+'</div>'}
function cView(){
 var i=C.info,h='';
 if(C.son){var o=C.son,m='Merhaba, halı aldırmak istiyorum. Sipariş no: #'+o.no+'. Ad: '+o.ad+'. Halı sayısı: '+o.adet+'. Adres: '+o.adr+(o.saat?'. Zaman: '+o.saat:'')+(o.not?'. Not: '+o.not:'')+'.';
  h+='<div class="card okc"><h2>Talebiniz alındı</h2><div>Sipariş numaranız: <span class="big">#'+o.no+'</span></div><div class="sub">Bu numarayla ya da telefonunuzla halınızın durumunu buradan sorgulayabilirsiniz.</div>'+(i.wa?'<div class="sub" style="margin-top:8px">Halıcının hemen görmesi için WhatsApp ile de haber verebilirsiniz.</div><a class="btn2 main" style="display:flex;margin-top:10px" target="_blank" rel="noopener" href="'+esc(wa(i.wa,m))+'">WhatsApp ile haber ver</a>':'')+'</div>'}
 h+='<div class="card"><h2>Halım nerede?</h2><div class="sub">Telefon numaranızı ya da sipariş numaranızı yazın.</div><div class="row" style="margin-top:10px"><input id="mno" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx veya 105" aria-label="Telefon veya sipariş no"><button class="btn2 main" id="msorgu" style="flex:0 0 auto">Sorgula</button></div></div>';
 if(C.sonuc)h+=C.sonuc.length?C.sonuc.map(cKart).join(''):'<div class="card empty">Bu numarayla sipariş bulunamadı. Numarayı kontrol edin.</div>';
 h+='<div class="card" id="form"><h2>Halımı aldırmak istiyorum</h2><div class="sub">Formu doldurun, halıcı sizi arasın.</div>'
 +'<label for="mad">Adınız</label><input id="mad" autocomplete="name" placeholder="Örn. Ayşe Yılmaz">'
 +'<label for="mtel">Telefon</label><input id="mtel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx">'
 +'<label for="madr">Adres</label><input id="madr" autocomplete="street-address" placeholder="Mahalle, sokak, kapı no">'
 +'<label for="msaat">Ne zaman gelelim?</label><select id="msaat">'+saatOpt()+'</select>'
 +'<label for="madet">Kaç halınız var?</label><input id="madet" inputmode="numeric" value="1">'
 +'<label for="mnot">Not (isteğe bağlı)</label><input id="mnot" placeholder="Örn. bir halıda leke var">'
 +'<div class="sub" style="margin-top:12px">Fiyat, halılarınız ölçüldükten sonra bildirilir. Bilgileriniz yalnızca halınızı almak için kullanılır.</div>'
 +'<button class="go" id="cgonder"'+(C.busy?' disabled':'')+'>Talep gönder</button></div>';
 if(i.turler&&i.turler.length)h+='<div class="card"><h2>Fiyatlarımız</h2><ul class="list">'+i.turler.map(function(t){return '<li><span>'+esc(t.ad)+'</span><b>'+fmt(t.bf)+' / m²</b></li>'}).join('')+'</ul></div>';
 if(i.wa||i.adres)h+='<div class="card"><h2>İletişim</h2>'+(i.adres?'<div class="sub">'+esc(i.adres)+'</div>':'')+(i.wa?'<div class="acts"><a class="btn2" href="tel:'+esc(rakam(i.wa))+'">Ara</a><a class="btn2" target="_blank" rel="noopener" href="'+esc(wa(i.wa,'Merhaba, halı yıkama hakkında bilgi almak istiyorum.'))+'">WhatsApp</a></div>':'')+'</div>';
 paint(h)}
async function cSorgu(q,sessiz){
 var r=await api('sorgu',{q:q});
 if(r.status!=200){if(r.status==402){paint(kapali(r.d));return}if(!sessiz)toast(errText(r.d));return}
 C.sonuc=r.d.list;cView()}
async function cStart(){
 addManifest();
 var r=await api('info');
 if(r.status!=200){paint(genelHata(r.status,r.d));if(r.d.ad)setHead(r.d.ad);return}
 C.info=r.d;setHead(r.d.ad);cView();
 var son=store('hali-son-'+KOD);if(son){$('mno').value=son;cSorgu(son,true)}
}
async function cClick(t){

async function pClick(t){
 var d=function(k){return t.getAttribute(k)},id=t.id;
 if(id=='ygiris'){await giris($('ypin').value.trim(),'yon');return}
 if(!S)return;
 if(d('data-t')){tab=d('data-t');pn={no:0,k:''};VIEW_RESET=true;ciz();window.scrollTo(0,0);return}
 if(id=='ekle'){var b=sayi($('boy').value),e=sayi($('en').value),n=parseInt($('adet').value,10)||1,ti=+$('tur').value;if(!(b>0)||!(e>0)){toast('Boy ve eni sayı olarak yazın. Örn. 3 ve 2');return}yeni.push({m2:Math.round(b*e*100)/100,n:n,tur:ti});ciz();$('boy').value='';$('en').value='';$('adet').value='1';return}
 if(d('data-sil')!==null){yeni.splice(+d('data-sil'),1);ciz();return}
 if(id=='kaydet'){var ad=$('ad').value.trim();if(!ad){toast('Müşteri adını yazın');return}
  var rugs=yeni.slice();if(!rugs.length){var b2=sayi($('boy').value),e2=sayi($('en').value);if(b2>0&&e2>0)rugs.push({m2:Math.round(b2*e2*100)/100,n:parseInt($('adet').value,10)||1,tur:+$('tur').value});else{toast('En az bir halı ekleyin');return}}
  var once=S.orders.reduce(function(m,o){return Math.max(m,o.no)},0);
  if(await call('yeni',{ad:ad,tel:$('tel').value.trim(),adr:$('adr').value.trim(),saat:$('saat').value,not:$('not').value.trim(),rugs:rugs})){
   var no=S.orders.reduce(function(m,o){return Math.max(m,o.no)},0);yeni=[];tab='halilar';dur='devam';ara='';VIEW_RESET=true;ciz();window.scrollTo(0,0);toast('Kayıt oluşturuldu. Sipariş no: '+(no>once?no:''))}
  return}
 if(d('data-olc')){var no1=d('data-olc'),v=sayi($('olc'+no1).value);if(!(v>0)){toast('Toplam m² yazın. Örn. 9');return}if(await call('olcu',{no:+no1,m2:v,tur:+$('otur'+no1).value})){pn={no:0,k:''};VIEW_RESET=true;ciz();var o=bul(no1);if(o)toast('Ölçü kaydedildi: '+v+' m² · '+fmt(tut(o)))}return}
 if(d('data-ileri')){var ni=+d('data-ileri');if(await call('ileri',{no:ni,from:+d('data-a')})){pn={no:0,k:''};ciz();var o1=bul(ni),w='Durum: '+NAMES[o1.a]+'. Müşteriye “WhatsApp ile haber ver” ile bildirebilirsiniz.';if(o1.a==LAST&&olcu(o1)>0&&kalan(o1)>0)w='Teslim edildi. Dikkat: '+fmt(kalan(o1))+' ödeme alınmadı.';else if(o1.a>=2&&!olcu(o1))w='Ölçü girilmedi, tutar hesaplanamıyor.';toast(w)}return}
 if(d('data-geri')){var ng=+d('data-geri');if(await call('geri',{no:ng,from:+d('data-a')})){ciz();toast('Geri alındı: '+NAMES[bul(ng).a])}return}
 if(d('data-pn')){var s=d('data-pn').split(':');if(pn.no==s[1]&&pn.k==s[0])pn={no:0,k:''};else pn={no:+s[1],k:s[0]};ciz();return}
 if(d('data-kapat')){pn={no:0,k:''};ciz();return}
 if(d('data-edk')){var na=$('e-ad').value.trim();if(!na){toast('Müşteri adını yazın');return}if(await call('duzenle',{no:+d('data-edk'),ad:na,tel:$('e-tel').value.trim(),adr:$('e-adr').value.trim(),not:$('e-not').value.trim()})){pn={no:0,k:''};ciz();toast('Değişiklikler kaydedildi')}return}
 if(d('data-odek')){var op=bul(d('data-odek')),am=sayi($('otut').value);if(!olcu(op)){toast('Önce ölçüyü kaydedin');return}if(!(am>0)){toast('Alınan tutarı yazın. Örn. 300');return}if(am>kalan(op)+0.01){toast('Yazdığınız tutar kalan tutardan fazla: '+fmt(kalan(op)));return}
  if(await call('ode',{no:op.no,tut:am,yon:$('oyon').value})){VIEW_RESET=true;ciz();toast('Ödeme kaydedildi: '+fmt(am))}return}
 if(d('data-odsil')){var q2=d('data-odsil').split(':');if(await call('odesil',{no:+q2[0],i:+q2[1]})){ciz();toast('Ödeme silindi')}return}
 if(d('data-silevet')){if(await call('sil',{no:+d('data-silevet')})){pn={no:0,k:''};ciz();toast('Sipariş silindi')}return}
 if(id=='mkop'){kopya($('mlink'),'Link kopyalandı');return}
 if(id=='qrind'){indir('qr-'+KOD+'.svg',QR.svg(link('r'),600),'image/svg+xml');toast('QR indirildi');return}
 if(id=='qryaz'){window.print();return}
 if(id=='kilit'){var yt=sstore(YTK);sstore(YTK,null);if(yt)api('logout',{},yt);tab='halilar';S=null;await yenile(true);toast('Yönetici bölümü kilitlendi');return}
 if(d('data-per')){donem=d('data-per');ciz();return}
 if(d('data-gsil')!==null){if(await call('gidersil',{id:d('data-gsil')})){ciz();toast('Masraf silindi')}return}
 if(id=='gkaydet'){var gt=sayi($('gtut').value);if(!(gt>0)){toast('Tutarı sayı olarak yazın. Örn. 450');return}if(await call('gider',{tur:$('gtur').value,tutar:gt,tar:$('gtar').value,not:$('gnot').value.trim()})){$('gtut').value='';$('gnot').value='';ciz();toast('Masraf kaydedildi')}return}
 if(id=='tekle'||d('data-tsil')!==null){var nt=turlerOku();if(id=='tekle')nt.push({ad:'',bf:''});else{if(nt.length<2){toast('En az bir tür kalmalı');return}nt.splice(+d('data-tsil'),1)}S.shop.turler=nt;VIEW_RESET=true;ciz();return}
 if(id=='fkaydet'){var nt2=turlerOku(),hata=nt2.some(function(x){return !x.ad||!(x.bf>0)});if(hata){toast('Her tür için ad ve fiyat yazın. Örn. 90');return}if(await call('ayar',{turler:nt2})){VIEW_RESET=true;ciz();toast('Fiyatlar kaydedildi')}return}
 if(id=='ikaydet'){var iw=$('iwa').value.trim();if(iw&&rakam(iw).length<10){toast('Numarayı 05xx ile başlayarak yazın');return}if(await call('ayar',{ad:$('iad').value.trim(),wa:iw,adres:$('iadr').value.trim()})){VIEW_RESET=true;ciz();toast('Bilgiler kaydedildi')}return}
 if(id=='pkaydety'||id=='pkaydetp'){var kim=id=='pkaydety'?'yon':'per',np=$(kim=='yon'?'npy':'npp').value;if(!/^\d{4,8}$/.test(np)){toast('PIN 4-8 rakam olmalı');return}if(await call('pin',{kim:kim,pin:np})){VIEW_RESET=true;ciz();toast((kim=='yon'?'Yönetici':'Personel')+' PIN’i değişti')}return}
 if(id=='yedek'){indir('hali-yedek-'+KOD+'-'+S.today+'.json',JSON.stringify({shop:S.shop,orders:S.orders,giderler:S.giderler,tarih:S.today},null,1),'application/json');return}
}
function turlerOku(){return S.shop.turler.map(function(t,i){return{ad:($('tad'+i)?$('tad'+i).value.trim():t.ad),bf:($('tbf'+i)?sayi($('tbf'+i).value):t.bf)}})}

/* ================= AÇILIŞ ================= */
function landing(){
 paint('<div class="card"><h2>Halı yıkama uygulaması</h2><div class="sub">Halıcınızın size verdiği linki ya da QR kodunu açın.</div><label for="kod">Halıcı kodu</label><div class="row"><input id="kod" autocapitalize="none" placeholder="Örn. kopuklu-hali-yikama"><button class="btn2 main" id="git" style="flex:0 0 auto">Aç</button></div></div>')}

document.addEventListener('click',function(ev){
 var t=ev.target.closest?ev.target.closest('button'):null;if(!t||t.disabled)return;
 if(AREA=='r')cClick(t);else if(AREA=='s')pClick(t);else if(t.id=='git'){var k=$('kod').value.trim().toLowerCase();if(k)location.href='/r/'+encodeURIComponent(k)}});
document.addEventListener('change',function(ev){var t=ev.target;if(AREA!='s'||!S)return;if(t.id=='ara'){ara=t.value;ciz()}if(t.id=='dur'){dur=t.value;ciz()}});
document.addEventListener('keydown',function(ev){if(ev.key!='Enter')return;var i=ev.target.id;var m={ypin:'ygiris',mno:'msorgu',kod:'git'};if(m[i]&&$(m[i])){ev.preventDefault();$(m[i]).click()}});
// Beklenmedik bir hata olursa "Yükleniyor"da takılmasın
function takildi(){var v=$('view');if(v&&/Yükleniyor/.test(v.textContent)&&v.children.length<2)v.innerHTML='<div class="card"><h2>Sayfa açılamadı</h2><div class="sub">İnternet bağlantınızı kontrol edip tekrar deneyin.</div><button class="go" onclick="location.reload()">Tekrar dene</button></div>'}
window.addEventListener('error',function(){setTimeout(takildi,0)});window.addEventListener('unhandledrejection',function(){setTimeout(takildi,0)});setTimeout(takildi,25000);
if(AREA=='r'&&KOD)cStart();else if(AREA=='s'&&KOD)pStart();else landing();
</script>
</body>
</html>
