<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sporum">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Sporum</title>
<style>
:root{--bg:#F4F7F6;--card:#fff;--ink:#142420;--mute:#56685F;--line:#DDE6E2;--acc:#0F5C4C;--on:#fff;--seg:#E9F0ED;--edge:#CCDAD4;--red:#C25A16;--ok:#1E7F4F;--bad:#B3261E;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1513;--card:#15211E;--ink:#E7F0EC;--mute:#9DB2AA;--line:#273833;--acc:#6FD3B5;--on:#08251D;--seg:#1C2B27;--edge:#304540;--red:#F0A25F;--ok:#5CCB98;--bad:#F08077;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1513;--card:#15211E;--ink:#E7F0EC;--mute:#9DB2AA;--line:#273833;--acc:#6FD3B5;--on:#08251D;--seg:#1C2B27;--edge:#304540;--red:#F0A25F;--ok:#5CCB98;--bad:#F08077;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--acc)}
.bant{height:5px;background:linear-gradient(90deg,var(--acc),var(--red))}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{margin-bottom:12px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
select,input{font:inherit;font-size:16px;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs[hidden]{display:none!important}
.tabs{display:flex;gap:2px;background:var(--seg);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs.stick{position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--bg)}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700;font-size:clamp(11px,3.3vw,15px);padding:10px 1px;border-radius:9px;cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:700;margin:0 0 6px}
label,.lbl{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.go{width:100%;margin-top:16px;border:0;background:var(--acc);color:var(--on);font:inherit;font-weight:700;font-size:17px;padding:14px;border-radius:12px;cursor:pointer;min-height:52px}
.go:disabled,.btn2:disabled{opacity:.5}
.btn2{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:9px 12px;border-radius:10px;cursor:pointer;min-height:44px}
.btn2.main{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn2.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn2.bad{color:var(--bad);border-color:var(--bad)}
.btn2.sm{min-height:34px;padding:3px 10px;font-size:13px;margin-left:6px}
.btn2[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:8px}
.grid.hz{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid .btn2{padding:8px 4px;flex-direction:column;line-height:1.25}
.grid .btn2 small{font-weight:500;font-size:13px;opacity:.85}
details.kat{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--card)}
details.kat summary{cursor:pointer;font-weight:700;padding:11px 12px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.kat summary::-webkit-details-marker{display:none}
details.kat summary::after{content:'+';color:var(--mute);font-weight:700}
details.kat[open] summary::after{content:'–'}
details.kat .grid,details.kat .ed{padding:0 10px 10px}
.secim{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--seg);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:12px}
.stat span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.stat b{display:block;color:var(--acc);font-size:20px;line-height:1.1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.mute{color:var(--mute)}.empty{color:var(--mute);padding:4px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);border:1px solid var(--edge);border-radius:99px;padding:1px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.red{color:var(--red);border-color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts>*{flex:1 1 auto}
.okc{border-color:var(--ok);border-width:2px}.badc{border-color:var(--bad)}.accc{border-color:var(--red);border-width:2px}
.done{opacity:.62}
.big{font-size:34px;font-weight:800;color:var(--acc);line-height:1.1}
.qr{background:#fff;border-radius:12px;padding:10px;max-width:240px;margin:12px auto 4px}
.qr svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600;border-top:0}
.oz td{text-align:left;vertical-align:top}.oz td:first-child{color:var(--mute);width:34%}
textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:200px}
.ed .er{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ed .row input,.ed .row select{padding:8px 6px;min-height:40px;font-size:15px}
.uye{border-top:1px solid var(--line);padding:10px 0}.uye:first-child{border-top:0}
.gun7{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.gun7 .btn2{min-height:34px;padding:2px 8px;font-size:13px;flex:1 1 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:688px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
@media print{body{background:#fff}.noprint,#tabs,header,.bant{display:none!important}.card{border:0}}
</style>
</head>

<div class="bant"></div>
<div class="wrap">
<header><div class="eyebrow" id="eyebrow">Sporum</div><h1 id="baslik">Spor Salonu</h1><div class="sub" id="slogan"></div></header>
<div class="tabs stick" id="tabs" role="group" aria-label="Bölümler" hidden></div>
<div id="view"><div class="card empty">Yükleniyor…</div></div>
<noscript><div class="card">Bu sayfa için tarayıcıda JavaScript açık olmalı.</div></noscript>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/*__BOOT__*/</script>
<script>
/*__QR__*/
</script>
<script>
'use strict';
var P=location.pathname.split('/').filter(Boolean),AREA=P[0],KOD=String(P[1]||'').toLowerCase();
var ERR={wrong_pin:'PIN yanlış.',too_many:'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.',network:'İnternet bağlantısı zayıf ya da yok. Tekrar deneyin.',no_name:'Adı yazın.',no_member_name:'Üye adını yazın. Üyelik ve paket satışında üye adı zorunlu.',bad_phone:'Telefonu 05xx xxx xx xx şeklinde yazın.',bad_date:'Tarih seçin.',past_date:'Geçmiş bir gün seçilemez.',too_far:'Bu kadar ileri bir tarih seçilemez.',bad_time:'Saat seçin.',past_time:'Bu saat geçti. Başka bir saat seçin.',slot_taken:'Bu saat az önce doldu. Başka bir saat seçin.',double:'Bu telefonla o gün için zaten randevunuz var.',double_class:'Bu telefonla bu derse zaten kayıtlısınız.',full:'Bu dersin kontenjanı doldu. Başka bir gün seçin.',no_class:'Ders bulunamadı. Sayfayı yenileyin.',not_yours:'Bu kayıt size ait değil.',changed:'Bu kayıt başka bir telefondan değişti. Liste yenilendi.',yonetici:'Bu işlem için yönetici girişi gerekir.',bad_pin:'PIN 4-8 rakam olmalı.',same_pin_yon:'Bu PIN yönetici PIN’iyle aynı. Personel PIN’i yönetici PIN’inden farklı olmalı.',same_pin_per:'Bu PIN bir antrenörün PIN’iyle aynı. Başka bir PIN seçin.',same_pin_other:'Bu PIN başka bir antrenörde var. Başka bir PIN seçin.',no_staff:'Antrenörü seçin.',bad_payment:'Nakit ya da kart seçin.',bad_amount:'Tutarı sayı olarak yazın.',no_service:'En az bir kalem seçin.',too_many_services:'Çok fazla kalem seçildi.',bad_services:'Her kalem için ayrı bir ad ve fiyat yazın.',bad_duration:'Süre geçersiz.',bad_days:'Gün sayısını kontrol edin.',bad_sessions:'Ders sayısını kontrol edin.',bad_classes:'Her ders için ad yazın.',no_days:'Dersin günlerini seçin.',bad_capacity:'Kontenjan 1 ile 300 arasında olmalı.',bad_rate:'Prim oranı 0 ile 100 arasında olmalı.',bad_step:'Randevu aralığını seçin.',too_many_staff:'En fazla 30 antrenör eklenebilir.',too_many_members:'Üye sınırına ulaşıldı.',tel_taken:'Bu telefonla kayıtlı başka bir üye var.',frozen:'Üyelik dondurulmuş. Önce dondurmayı bitirin.',not_frozen:'Üyelik dondurulmuş değil.',expired:'Üyeliği bitmiş. Önce aidat alın.',no_session:'Pakette ders kalmadı.',already_in:'Bugün girişi zaten kaydedildi.',not_found_randevu:'Randevu bulunamadı. Liste yenilendi.',not_found_kayit:'Kayıt bulunamadı. Liste yenilendi.',not_found_uye:'Üye bulunamadı. Liste yenilendi.',not_found_katilim:'Ders kaydı bulunamadı.',not_found_giris:'Giriş bulunamadı.',kod_taken:'Bu link kodu kullanılıyor. Başka bir kod yazın.',bad_kod:'Link kodu en az 3 harf olmalı.',too_many_branches:'En fazla 20 şube açılabilir.',no_main:'Merkez şube bulunamadı.',server:'Bir sorun oldu. Tekrar deneyin.'};
var GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],GK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
var TUR={uyelik:'Üyelik',paket:'Ders paketi',hizmet:'Hizmet',urun:'Ürün'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Math.round(n||0).toLocaleString('tr-TR')+' TL'}
function sayi(v){return parseFloat(String(v).replace(',','.'))}
function rakam(s){return String(s||'').replace(/\D/g,'')}
function fd(d){return String(d||'').split('-').reverse().join('.')}
function addD(d,n){var x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function fark(a,b){return Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/864e5)}
function wday(d){return GUNLER[new Date(d+'T12:00:00Z').getUTCDay()]}
function telOk(t){var d=rakam(t);if(d.length==12&&d.slice(0,2)=='90')d=d.slice(2);else if(d.length==11&&d[0]=='0')d=d.slice(1);return d.length==10&&d[0]=='5'}
function nor(tel){var d=rakam(tel);if(d.length==11&&d[0]=='0')d='90'+d.slice(1);else if(d.length==10)d='90'+d;return d}
function wa(tel,msg){return 'https://wa.me/'+(tel?nor(tel):'')+'?text='+encodeURIComponent(msg)}
function dk(s){return +s.slice(0,2)*60+ +s.slice(3,5)}
function saatEkle(s,m){var x=(dk(s)+m)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function sureYaz(m){m=Math.round(m||0);var s=Math.floor(m/60),d=m%60;return (s?s+' sa':'')+(s&&d?' ':'')+(d||!s?d+' dk':'')}
function hzYaz(h){return Array.isArray(h)?h.join(' + '):String(h||'')}
function toast(t){var e=$('toast');e.textContent=t;e.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){e.className=''},4500)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function sstore(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function setHead(ad,eyebrow,slogan){$('baslik').textContent=ad||'Spor Salonu';document.title=ad||'Sporum';if(eyebrow)$('eyebrow').textContent=eyebrow;if(slogan!==undefined)$('slogan').textContent=slogan}
function link(t,k){return location.origin+'/'+t+'/'+(k||KOD)}
function addManifest(){var l=document.createElement('link');l.rel='manifest';l.href='/'+AREA+'/'+KOD+'/app.webmanifest';document.head.appendChild(l)}
function gunEt(d,bugun){return d==bugun?'Bugün':d==addD(bugun,1)?'Yarın':d==addD(bugun,-1)?'Dün':fd(d)+' '+wday(d)}

// Ekran yeniden çizilince yazılan yazılar kaybolmasın
var VIEW_RESET=false;
function paint(html){
 var v=$('view'),keep={},act=document.activeElement,fid=act&&act.id,sel=null;
 if(!VIEW_RESET)v.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(e){if(!e.readOnly&&e.type!=='password')keep[e.id]=e.value});
 try{if(fid&&act.selectionStart!=null)sel=[act.selectionStart,act.selectionEnd]}catch(e){}
 v.innerHTML=html;VIEW_RESET=false;
 Object.keys(keep).forEach(function(id){var e=$(id);if(e&&!e.hasAttribute('data-fresh'))e.value=keep[id]});
 if(fid&&$(fid)&&v.contains($(fid))){var f=$(fid);f.focus();try{if(sel)f.setSelectionRange(sel[0],sel[1])}catch(e){}}
}

async function api(path,body,tok,tries){
 var h={};if(body!==undefined)h['content-type']='application/json';if(tok)h.authorization='Bearer '+tok;
 // Zayıf mobil veride sonsuza kadar beklemesin: 20 saniyede vazgeç; okuma isteklerini bir kez yeniden dene
 var ac=typeof AbortController!='undefined'?new AbortController():null,to=ac?setTimeout(function(){ac.abort()},20000):0;
 var r;try{r=await fetch('/api/'+AREA+'/'+KOD+'/'+path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:ac?ac.signal:undefined})}catch(e){clearTimeout(to);if(body===undefined&&!tries){await new Promise(function(r){setTimeout(r,1500)});return api(path,body,tok,1)}return{status:0,d:{error:'network'}}}
 clearTimeout(to);
 var d={};try{d=await r.json()}catch(e){}
 return{status:r.status,d:d}
}
function errText(d){return ERR[d&&d.error]||ERR.server}

function kapali(d){
 if(AREA=='r')return '<div class="card badc"><h2>Online kayıt şu an kapalı</h2><div class="sub">'+esc(d.ad||'Salon')+' şu anda internetten randevu almıyor. Lütfen telefonla ulaşın.</div>'+(d.tel?'<div class="acts"><a class="btn2 main" href="tel:'+esc(rakam(d.tel))+'">Ara: '+esc(d.tel)+'</a></div>':'')+'</div>';
 return '<div class="card badc"><h2>Aboneliğiniz sona erdi</h2><div class="sub">Uygulamayı kullanmaya devam etmek için lütfen ödemenizi yapın. Kayıtlarınız güvende, ödeme sonrası hemen açılır.</div>'+(d.wa?'<div class="acts"><a class="btn2 main" target="_blank" rel="noopener" href="'+esc(wa(d.wa,'Merhaba, '+(d.ad||'')+' spor salonu aboneliğim hakkında yazıyorum.'))+'">WhatsApp’tan yazın</a></div>':'')+'</div>'}
function genelHata(st,d){
 if(st==402)return kapali(d);
 if(st==409&&d.error=='setup')return '<div class="card"><h2>Hazırlanıyor</h2><div class="sub">'+esc(d.ad||'Bu salon')+' için uygulama henüz kurulmadı. '+(AREA=='s'?'Yönetici PIN’inin sahip panelinden belirlenmesi gerekiyor.':'Lütfen daha sonra tekrar deneyin.')+'</div></div>';
 if(st==404)return '<div class="card"><h2>Salon bulunamadı</h2><div class="sub">Bu link geçersiz. Salonunuzdan doğru linki isteyin.</div></div>';
 return '<div class="card"><h2>Bağlanılamadı</h2><div class="sub">'+esc(errText(d))+'</div><button class="go" onclick="location.reload()">Tekrar dene</button></div>'}

/* ---- Ortak: kategorili kalem seçici ---- */
var ACIK={};
function katlar(list){var o=[],m={};list.forEach(function(h){var k=h.kat||'Diğer';if(!m[k]){m[k]=[];o.push(k)}m[k].push(h)});return{sira:o,m:m}}
function hzEtiket(h,fiyatli){var x=h.tur=='uyelik'?h.gun+' gün':h.tur=='paket'?h.seans+' ders':h.tur=='urun'?'':sureYaz(h.sure);return fiyatli?fmt(h.fiyat)+(x?' · '+x:''):(x||sureYaz(h.sure))}
function hzSec(on,list,secili,fiyatli){
 var k=katlar(list);
 return k.sira.map(function(kat){var n=k.m[kat].filter(function(h){return secili.indexOf(h.ad)>=0}).length,ac=n||ACIK[on+kat];
  return '<details class="kat" data-acik="'+esc(on+kat)+'"'+(ac?' open':'')+'><summary><span>'+esc(kat)+(n?' <span class="chip">'+n+' seçili</span>':'')+'</span></summary><div class="grid hz">'
  +k.m[kat].map(function(h){return '<button class="btn2" data-hp="'+on+'" data-hn="'+esc(h.ad)+'" aria-pressed="'+(secili.indexOf(h.ad)>=0)+'">'+esc(h.ad)+'<small>'+esc(hzEtiket(h,fiyatli))+'</small></button>'}).join('')+'</div></details>'}).join('')}
function topla(list,secili,aralik){var o={fiyat:0,sure:0,n:0,uye:false};list.forEach(function(h){if(secili.indexOf(h.ad)>=0){o.n++;o.fiyat+=+h.fiyat||0;o.sure+=h.tur=='urun'?0:(+h.sure||0);if(h.tur=='uyelik'||h.tur=='paket')o.uye=true}});o.sure=Math.max(aralik||0,o.sure);return o}
function hzToggle(arr,ad,tek){var i=arr.indexOf(ad);if(i>=0)arr.splice(i,1);else{if(tek)arr.length=0;if(arr.length>=8){toast(ERR.too_many_services);return false}arr.push(ad)}return true}
document.addEventListener('toggle',function(ev){var t=ev.target;if(t&&t.getAttribute&&t.getAttribute('data-acik'))ACIK[t.getAttribute('data-acik')]=t.open},true);

/* ================= MÜŞTERİ SAYFASI (/r/<kod>) ================= */
// Müşteri yalnızca randevu ve ders kaydı formunu görür: ürün, ücret ve sıfır fiyatlı kalemler gelmez
var C={i:null,mod:'r',gun:'',per:'',saat:'',hz:[],slots:null,sk:'',busy:false,son:null,benim:null,adim:'form',ad:'',tel:'',not:'',ders:null};
function keys(){try{return JSON.parse(store('sk-'+KOD)||'{}')}catch(e){return{}}}
function keySet(id,k){var o=keys();if(k)o[id]=k;else delete o[id];store('sk-'+KOD,JSON.stringify(o))}
function cTop(){return topla(C.i.hizmetler,C.hz,C.i.aralik)}
function perAdC(id){var p=C.i.personel.filter(function(x){return x.id==id})[0];return p?p.ad:''}
function cSon(){
 var o=C.son,i=C.i;if(!o)return '';
 var ne=o.ders?o.ders+' dersine kayıt oldum':hzYaz(o.hz)+' için randevu aldım';
 var m='Merhaba, '+gunEt(o.gun,i.gun).toLocaleLowerCase('tr-TR')+' ('+fd(o.gun)+') saat '+o.saat+' '+ne+'. Ad: '+o.ad+(o.per?'. Antrenör: '+o.per:'')+'.';

/* ================= AÇILIŞ ================= */
function landing(){
 paint('<div class="card"><h2>Sporum</h2><div class="sub">Salonunuzun size verdiği linki ya da QR kodunu açın.</div><label for="kod">Salon kodu</label><div class="row"><input id="kod" autocapitalize="none" placeholder="Örn. atlas-spor"><button class="btn2 main" id="git" style="flex:0 0 auto">Aç</button></div></div>')}

document.addEventListener('click',function(ev){
 var t=ev.target.closest?ev.target.closest('button'):null;if(!t||t.disabled)return;
 if(AREA=='r'){if(C.i)cClick(t)}else if(AREA=='s')pClick(t);else if(t.id=='git'){var k=$('kod').value.trim().toLowerCase();if(k)location.href='/r/'+encodeURIComponent(k)}});
document.addEventListener('change',function(ev){var t=ev.target;
 if(AREA=='r'&&C.i){if(t.id=='mgun'){cOku();cGun(t.value)}if(t.id=='mper'){cOku();C.per=t.value;C.slots=null;cView();cSlots()}return}
 if(AREA!='s'||!S)return;
 if(t.id=='rgun'&&t.value){R.gun=t.value<addD(S.gun,-1)?addD(S.gun,-1):t.value;R.kat='';ciz()}
 if(t.id=='kper'){K.per=t.value;ciz()}
 if(t.id=='kuye'){K.uye=t.value;ciz()}
 if(t.id=='rapgun'&&t.value){rapGun=t.value>S.gun?S.gun:t.value;ciz()}});
document.addEventListener('input',function(ev){if(AREA=='s'&&S&&ev.target.id=='uq'){U.q=ev.target.value;ciz()}});
document.addEventListener('keydown',function(ev){if(ev.key!='Enter')return;var i=ev.target.id;var m={gpin:'giris',ypin:'ygiris',ipin:'igiris',btel:'bgoster',kod:'git'};if(m[i]&&$(m[i])){ev.preventDefault();$(m[i]).click()}});
// Beklenmedik bir hata olursa "Yükleniyor"da takılmasın
function takildi(){var v=$('view');if(v&&/Yükleniyor/.test(v.textContent)&&v.children.length<2)v.innerHTML='<div class="card"><h2>Sayfa açılamadı</h2><div class="sub">İnternet bağlantınızı kontrol edip tekrar deneyin.</div><button class="go" onclick="location.reload()">Tekrar dene</button></div>'}
window.addEventListener('error',function(){setTimeout(takildi,0)});window.addEventListener('unhandledrejection',function(){setTimeout(takildi,0)});setTimeout(takildi,25000);
if(AREA=='r'&&KOD)cStart();else if(AREA=='s'&&KOD)pStart();else landing();
</script>
