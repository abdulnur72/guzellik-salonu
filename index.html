<style>
:root{--bg:#FBF4F6;--card:#fff;--ink:#2B1330;--mute:#7B6680;--line:#E4D2DD;--acc:#B83A74;--on:#fff;--seg:#F6E7EE;--edge:#DDB0C6;--ok:#3E8E74;--bad:#C0443B;--font:Manrope,system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B0F1E;--card:#2A1A2E;--ink:#F6E9F1;--mute:#B79FBE;--line:#4A3350;--acc:#E26AA0;--on:#2d0b18;--seg:#3A2540;--edge:#7A4A6C;--ok:#6CC2A4;--bad:#F08077;color-scheme:dark}}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.pole{height:3px;background:var(--acc)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{margin-bottom:14px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:2px;background:var(--seg);border-radius:10px;padding:3px;margin-bottom:16px}

.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on)}

.card h2{font-size:15px;font-weight:700;margin:0 0 6px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.row{display:flex;gap:10px}.row>*{flex:1}
.go{width:100%;margin-top:18px;border:0;background:var(--acc);color:var(--on);font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:14px 12px}
.stat span{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px}

.mute{color:var(--mute)}.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}

th{font-size:12px;color:var(--mute);font-weight:600;border-top:0}
td input{width:68px;padding:6px 8px;text-align:right}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-top:8px}
.empty{color:var(--mute);padding:6px 0}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;overflow:hidden;flex:none;border:1px solid var(--edge);border-radius:12px;display:grid;place-items:center;color:var(--acc)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.strip{background:var(--seg);color:var(--acc);font-size:13px;text-align:center;padding:10px 12px;border-radius:8px;margin-bottom:14px}

.owner::after{content:"";position:absolute;left:42px;bottom:-9px;width:16px;height:16px;background:var(--card);border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);transform:rotate(45deg)}
.sq{width:72px;height:72px;flex:none;border-radius:10px;border:1px solid var(--edge);background:var(--seg);color:var(--acc);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:26px}
.sq img{width:100%;height:100%;object-fit:cover}
.pick{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(72px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.pk{background:var(--seg);border:1px solid var(--line);border-radius:10px;padding:8px 6px;color:var(--ink);font:inherit;font-weight:600;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pk[aria-pressed="true"]{border-color:var(--acc);background:var(--card);box-shadow:inset 0 0 0 1px var(--acc)}
.pick .pk .sq{width:100%;height:auto;aspect-ratio:1;font-size:22px}
.pk .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.qk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.qk .pk{padding:12px 8px;font-size:14px;text-align:center}.qk .pk b{font-weight:700}.qk .pk span{font-size:12px;font-weight:500}
.catbar{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.pill{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--seg);color:var(--ink);font:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:99px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:var(--seg);color:var(--ink);font:inherit;font-weight:600;padding:9px 0;border-radius:8px;cursor:pointer}
.slots button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.slots button:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.ok{color:var(--ok);font-weight:700}
summary{cursor:pointer;font-weight:700}

.list li{font-size:16px;padding:12px 0}
table{font-size:16px}
th{font-size:14px}
.strip{font-size:15px;padding:12px 14px;border-radius:12px}
.owner{border-radius:16px}
.owner .eyebrow{font-size:14px}
.pk{font-size:15px;border-radius:14px}
.qk .pk{font-size:16px;padding:14px 10px;min-height:72px}
.qk .pk span{font-size:14px}
.pill{font-size:15px;padding:10px 16px;min-height:44px}
.slots button{font-size:16px;padding:12px 0;border-radius:10px;min-height:48px}
.empty{font-size:16px}
.mute{font-size:inherit}

body.mus .tabs,body.mus .orn{display:none}

const CUT=()=>{try{const h=S&&S.cut;return h==null||h===""?4:+h}catch(e){return 4}};const today=()=>iso(new Date(Date.now()-CUT()*36e5));

/* [işlem, süre dk, fiyat ₺] */
const CAT=[
['El & Tırnak',[['Manikür',45,300],['Spa manikür',60,450],['Pedikür',60,350],['Spa pedikür',75,500],['Medikal pedikür',60,600],['Oje (klasik) el',30,150],['Oje (klasik) ayak',30,150],['Kalıcı oje el',60,450],['Kalıcı oje ayak',45,400],['Jel tırnak (yeni set)',90,700],['Protez tırnak (porselen/akrilik)',120,900],['Protez tırnak dolgu / bakım',90,600],['Tırnak güçlendirme (BIAB)',60,500],['Nail art (tırnak başına)',10,50],['French / ombre uygulaması',20,150],['Kalıcı oje / jel çıkarma',20,100],['Tırnak şekillendirme ve törpüleme',20,100],['Nasır / çatlak bakımı',30,250],['Parafin el bakımı',30,300],['Parafin ayak bakımı',30,300]]],

];
function seed(){return{salon:'Lila Güzellik Salonu',ver:2,
 services:CAT.flatMap(c=>c[1].map(x=>({id:uid(),k:c[0],ad:x[0],sure:x[1],fiyat:x[2],ps:x[4]}))),
 staff:[{id:uid(),ad:'Ayşe',prim:40},{id:uid(),ad:'Elif',prim:35},{id:uid(),ad:'Selin',prim:40}],

if(!S){S=seed();try{const o=JSON.parse(localStorage.getItem('salon-v1'));if(o)['salon','staff','customers','appts','gider','pin','logo'].forEach(k=>{if(o[k]!=null)S[k]=o[k]})}catch(x){}}
S.gider=S.gider||[];S.pin=S.pin||'1234';

const saveMy=()=>{try{localStorage.setItem('lila-my',JSON.stringify(MY))}catch(x){}};

let CQ='',CO=null,MOK='',GI='',GM='',PS=null,tab=MUS?'m':'p',U=null,B=false,OW=false,D=today(),KW=newW(),AW=newW(),RP='',MSG='';

 else if(a==='rapor'){const t=today(),l=S.appts.filter(x=>x.tarih===t&&done(x)),g=S.gider.filter(x=>x.tarih===t).reduce((s,x)=>s+x.tutar,0);RP=S.salon+' · '+gunAd(t)+'\nCiro: '+TL(sum(l))+'\nNakit: '+TL(sum(l.filter(x=>x.odeme==='Nakit')))+' · Kart: '+TL(sum(l.filter(x=>x.odeme==='Kart')))+'\n'+S.staff.map(p=>{const q=l.filter(x=>x.pid===p.id);return p.ad+': '+q.length+' müşteri, '+TL(sum(q))}).join('\n')+'\nGider: '+TL(g)+'\nNet: '+TL(sum(l)-S.staff.reduce((s,p)=>s+pay(p.id,t,t),0)-g)}
 else if(a==='pEkle'){const ad=val('pn');if(!ad)return;S.staff.push({id:uid(),ad,prim:+val('pp')||0,rol:val('pr')||undefined})}
 else if(a==='pSil')S.staff=S.staff.filter(p=>p.id!==d.id);
 else if(a==='pSifir'){const p=stf(d.id);if(p)delete p.pin}
 else if(a==='sEkle'){const ad=val('sn'),k=val('sk')||'Diğer';if(!ad)return;S.services.push({id:uid(),k,ad,sure:+val('ss')||30,fiyat:+val('sf')||0})}
 else if(a==='sSil')S.services=S.services.filter(s=>s.id!==d.id);
 else if(a==='ad'){S.salon=val('sa')||S.salon;S.owner=val('so')}
 save();render();
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&b.tagName!=='INPUT')act(b.dataset.a,b.dataset)});
function foto(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,200/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
function bkCard(){return `<div class="card"><h2>Yedek ve geri yükleme</h2><p class="mute" style="margin:0 0 8px">${OW?'Tüm işletmenin (bütün şubelerin)':'Bu şubenin'} kayıtlarını dosya olarak indir. Veri kaybolursa ya da başka cihaza taşımak istersen aynı dosyayı geri yükle. Dosyada müşteri bilgileri ve PIN’ler var, güvenli sakla.</p><p style="margin:0 0 8px">${R.yedek?'Son yedek: '+fd2(R.yedek):'Henüz yedek alınmadı.'}</p><div class="row"><button class="btn2" data-a="bkIndir">Yedek indir</button><label class="btn2" style="margin:0;cursor:pointer;text-align:center">Yedekten yükle<input type="file" accept=".json,application/json" data-bk="1" style="display:none"></label></div></div>`}
async function bkSave(){R.subeler[R.aktif].d=S;const full=OW,pack={tip:'lila-yedek',ver:1,kapsam:full?'isletme':'sube',tarih:new Date().toISOString(),salon:S.salon,veri:full?R:S};let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(x){}
 if(!dl){const u=URL.createObjectURL(new Blob([JSON.stringify(pack)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='lila-yedek-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);R.yedek=today();save();render();return}
 try{await dl.save({filename:'lila-yedek-'+today()+'.json',data:JSON.stringify(pack)});R.yedek=today();save();render()}catch(x){if(x&&x.code==='declined')return;alert('Yedek indirilemedi.')}}
function bkOk(d){return d&&Array.isArray(d.services)&&Array.isArray(d.staff)&&Array.isArray(d.appts)&&Array.isArray(d.customers)}
function bkClean(d){const img=u=>typeof u==='string'&&/^data:image\//.test(u);d.gider=d.gider||[];d.pkgs=d.pkgs||[];d.stok=d.stok||STOK0.map(x=>({id:uid(),ad:x[0],adet:x[1],min:x[2]}));d.pin=d.pin||'1234';d.ver=d.ver||3;if(d.logo&&!img(d.logo))delete d.logo;d.staff.forEach(p=>{if(p.foto&&!img(p.foto))delete p.foto});return d}
function bkRestore(f){const r=new FileReader();r.onload=()=>{let p=null;try{p=JSON.parse(r.result)}catch(x){}
 if(!p||p.tip!=='lila-yedek'||!p.veri){alert('Bu dosya bir yedek dosyası değil.');return}
 if(p.kapsam==='isletme'){if(!OW){alert('Tüm işletme yedeğini sadece İşletme sekmesinden, sahip girişiyle yükleyebilirsin.');return}
  const v=p.veri;if(!Array.isArray(v.subeler)||!v.subeler.length||!v.subeler.every(s=>bkOk(s.d))){alert('Yedek dosyası bozuk görünüyor, yüklenmedi.');return}
  if(!confirm('Şu anki tüm kayıtlar silinip yerine yedekteki kayıtlar gelecek ('+v.subeler.length+' şube). Devam edelim mi?'))return;
  v.subeler.forEach(s=>bkClean(s.d));v.opin=v.opin||'1234';v.ilk=v.ilk==null?500:v.ilk;v.ek=v.ek==null?250:v.ek;v.aktif=Math.min(v.aktif||0,v.subeler.length-1);R=v;S=R.subeler[R.aktif].d}
 else if(p.kapsam==='sube'){if(!bkOk(p.veri)){alert('Yedek dosyası bozuk görünüyor, yüklenmedi.');return}
  if(!confirm('Bu şubenin şu anki kayıtları silinip yerine yedekteki kayıtlar ('+(p.veri.salon||'şube')+') gelecek. Devam edelim mi?'))return;
  S=bkClean(p.veri);R.subeler[R.aktif].d=S}
 else{alert('Bu dosya bir yedek dosyası değil.');return}
 U=null;PS=null;CO=null;CQ='';KW=newW();AW=newW();MW=newW();D=today();RP='';save();render();alert('Yedek yüklendi.')};r.readAsText(f)}
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.bk){const f=t.files&&t.files[0];t.value='';if(f)bkRestore(f);return}
 if(t.id==='sb'){R.aktif=+t.value;S=R.subeler[R.aktif].d;B=OW;U=null;PS=null;save();render();return}
 if(t.dataset.fee){R[t.dataset.fee]=+t.value||0;save();render();return}
 if(t.id==='wt'){AW.tarih=(t.value&&t.value>=today())?t.value:today();AW.saat=null;render();return}
 if(t.id==='mt'){MW.tarih=(t.value&&t.value>=today())?t.value:today();MW.saat=null;render();return}
 if(t.id==='wr'){AW.oda=t.value;AW.saat=null;render();return}
 if(t.dataset.cf){const c=cus(t.dataset.cid);if(c){c[t.dataset.cf]=t.type==='number'?(+t.value||0):t.value;save()}return}
 if(t.dataset.fp){const s=svc(t.dataset.fp);if(s){s.fiyat=+t.value||0;save()}return}
 if(t.id==='sad'||t.id==='stel'||t.id==='ssaat'){S[{sad:'adres',stel:'tel',ssaat:'saat'}[t.id]]=t.value.trim();save();render();return}if(t.id==='sc'){S.cut=+t.value;save();render();return}if(t.dataset.pr){const p=stf(t.dataset.pr);if(p){p.prim=+t.value||0;save()}return}
 const f=t.files&&t.files[0],k=t.dataset&&t.dataset.foto;if(f&&k)foto(f,u=>{if(k==='logo')S.logo=u;else if(stf(k))stf(k).foto=u;save();render()})});
document.addEventListener('input',ev=>{const t=ev.target,m={kn:()=>KW.kn=t.value,kt:()=>KW.tut=t.value,wn:()=>AW.ad=t.value,wp:()=>AW.tel=t.value,wo:()=>AW.not=t.value,ko:()=>KW.o=t.value,mn:()=>MW.ad=t.value,mp:()=>MW.tel=t.value,mo:()=>MW.not=t.value,mk:()=>MW.kv=t.checked,gi:()=>GI=t.value,cq:()=>{CQ=t.value;const l=document.getElementById('clist');if(l)l.innerHTML=cList()}};if(m[t.id])m[t.id]()});
render(); let _gd=today();setInterval(()=>{const n=today();if(n!==_gd){if(D===_gd)D=n;_gd=n;try{render()}catch(e){}}},60000);
</script>
