<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Berberim">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-512-maskable.png">
<title>Berberim</title>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#14202E;--mute:#5B6B7D;--line:#DCE3EB;--acc:#1F3A5F;--on:#fff;--seg:#E8EDF3;--edge:#C3CFDC;--red:#C8102E;--ok:#1E7F4F;--bad:#B3261E;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D141C;--card:#16212D;--ink:#E8EEF4;--mute:#9AABBD;--line:#273646;--acc:#7FA7D6;--on:#0B1622;--seg:#1C2937;--edge:#33475C;--red:#FF7B8A;--ok:#5CCB98;--bad:#F08077;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D141C;--card:#16212D;--ink:#E8EEF4;--mute:#9AABBD;--line:#273646;--acc:#7FA7D6;--on:#0B1622;--seg:#1C2937;--edge:#33475C;--red:#FF7B8A;--ok:#5CCB98;--bad:#F08077;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--acc)}
.pole{height:5px;background:repeating-linear-gradient(135deg,var(--red) 0 10px,#fff 10px 20px,var(--acc) 20px 30px,#fff 30px 40px)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{margin-bottom:12px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
select,input{font:inherit;font-size:16px;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs[hidden]{display:none!important}
.tabs{display:flex;gap:2px;background:var(--seg);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs.stick{position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--bg)}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700;font-size:clamp(11px,3.3vw,15px);padding:10px 1px;border-radius:9px;cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:700;margin:0 0 6px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.go{width:100%;margin-top:16px;border:0;background:var(--acc);color:var(--on);font:inherit;font-weight:700;font-size:17px;padding:14px;border-radius:12px;cursor:pointer;min-height:52px}
.go:disabled,.btn2:disabled{opacity:.5}
.btn2{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:9px 12px;border-radius:10px;cursor:pointer;min-height:44px}
.btn2.main{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn2.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn2.bad{color:var(--bad);border-color:var(--bad)}
.btn2.sm{min-height:34px;padding:3px 10px;font-size:13px;margin-left:6px}
.btn2[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.grid.hz{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid .btn2{padding:8px 4px;flex-direction:column;line-height:1.25}
.grid .btn2 small{font-weight:500;font-size:13px;opacity:.85}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:12px}
.stat span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.stat b{display:block;color:var(--acc);font-size:20px;line-height:1.1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.mute{color:var(--mute)}.empty{color:var(--mute);padding:4px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);border:1px solid var(--edge);border-radius:99px;padding:1px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.red{color:var(--red);border-color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts>*{flex:1 1 auto}
.okc{border-color:var(--ok);border-width:2px}.badc{border-color:var(--bad)}
.done{opacity:.62}
.big{font-size:34px;font-weight:800;color:var(--acc);line-height:1.1}
.qr{background:#fff;border-radius:12px;padding:10px;max-width:240px;margin:12px auto 4px}
.qr svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600;border-top:0}
textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:200px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:688px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
@media print{body{background:#fff}.noprint,#tabs,header,.pole{display:none!important}.card{border:0}}
</style>
</head>
<body>
<div class="pole"></div>
<div class="wrap">
<header><div class="eyebrow" id="eyebrow">Berberim</div><h1 id="baslik">Berber</h1><div class="sub" id="slogan"></div></header>
<div class="tabs stick" id="tabs" role="group" aria-label="Bölümler" hidden></div>
<div id="view"><div class="card empty">Yükleniyor…</div></div>
<noscript><div class="card">Bu sayfa için tarayıcıda JavaScript açık olmalı.</div></noscript>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/*__BOOT__*/</script>
<script>
/*__QR__*/
</script>
<script>
'use strict';
var P=location.pathname.split('/').filter(Boolean),AREA=P[0],KOD=String(P[1]||'').toLowerCase();
var ERR={demo_closed:'Bu bölüm demo dükkânda kapalı.',wrong_pin:'PIN yanlış.',too_many:'Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.',network:'İnternet bağlantısı zayıf ya da yok. Tekrar deneyin.',no_name:'Adı yazın.',bad_phone:'Telefonu 05xx xxx xx xx şeklinde yazın.',bad_date:'Tarih seçin.',past_date:'Geçmiş bir güne randevu alınamaz.',too_far:'En fazla 30 gün sonrasına randevu alınır.',bad_time:'Saat seçin.',sira_today:'Sıraya yalnızca bugün için girilir. Başka gün için saat seçin.',past_time:'Bu saat geçti. Başka bir saat seçin.',slot_taken:'Bu saat az önce doldu. Başka bir saat seçin.',too_many_same:'Bu telefonla o gün için zaten randevunuz var.',not_yours:'Bu kayıt size ait değil.',changed:'Bu kayıt başka bir telefondan değişti. Liste yenilendi.',yonetici:'Bu işlem için yönetici girişi gerekir.',bad_pin:'PIN 4-8 rakam olmalı.',same_pin_yon:'Bu PIN yönetici PIN’iyle aynı. Personel PIN’i yönetici PIN’inden farklı olmalı.',same_pin_per:'Bu PIN bir personelin PIN’iyle aynı. Başka bir PIN seçin.',same_pin_other:'Bu PIN başka bir personelde var. Başka bir PIN seçin.',no_staff:'Berberi seçin.',bad_payment:'Nakit ya da kart seçin.',bad_amount:'Tutarı sayı olarak yazın.',no_service:'Hizmeti seçin.',bad_services:'Her hizmet için ayrı bir ad ve fiyat yazın.',bad_rate:'Prim oranı 0 ile 100 arasında olmalı.',bad_step:'Randevu aralığını seçin.',too_many_staff:'En fazla 30 personel eklenebilir.',not_found_randevu:'Randevu bulunamadı. Liste yenilendi.',not_found_kayit:'Kayıt bulunamadı. Liste yenilendi.',kod_taken:'Bu link kodu kullanılıyor. Başka bir kod yazın.',bad_kod:'Link kodu en az 3 harf olmalı.',too_many_branches:'En fazla 20 şube açılabilir.',no_main:'Merkez şube bulunamadı.',server:'Bir sorun oldu. Tekrar deneyin.'};
var GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Math.round(n||0).toLocaleString('tr-TR')+' TL'}
function sayi(v){return parseFloat(String(v).replace(',','.'))}
function rakam(s){return String(s||'').replace(/\D/g,'')}
function fd(d){return String(d||'').split('-').reverse().join('.')}
function addD(d,n){var x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function wday(d){return GUNLER[new Date(d+'T12:00:00Z').getUTCDay()]}
function telOk(t){var d=rakam(t);if(d.length==12&&d.slice(0,2)=='90')d=d.slice(2);else if(d.length==11&&d[0]=='0')d=d.slice(1);return d.length==10&&d[0]=='5'}
function nor(tel){var d=rakam(tel);if(d.length==11&&d[0]=='0')d='90'+d.slice(1);else if(d.length==10)d='90'+d;return d}
function wa(tel,msg){return 'https://wa.me/'+(tel?nor(tel):'')+'?text='+encodeURIComponent(msg)}
function dk(s){return +s.slice(0,2)*60+ +s.slice(3,5)}
function toast(t){var e=$('toast');e.textContent=t;e.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){e.className=''},4500)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function sstore(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function setHead(ad,eyebrow,slogan){$('baslik').textContent=ad||'Berber';document.title=ad||'Berberim';if(eyebrow)$('eyebrow').textContent=eyebrow;if(slogan!==undefined)$('slogan').textContent=slogan}
function link(t,k){return location.origin+'/'+t+'/'+(k||KOD)}
function addManifest(){var l=document.createElement('link');l.rel='manifest';l.href='/'+AREA+'/'+KOD+'/app.webmanifest';document.head.appendChild(l)}
function gunEt(d,bugun){return d==bugun?'Bugün':d==addD(bugun,1)?'Yarın':d==addD(bugun,-1)?'Dün':fd(d)+' '+wday(d)}

// Ekran yeniden çizilince yazılan yazılar kaybolmasın
var VIEW_RESET=false;
function paint(html){
 var v=$('view'),keep={},act=document.activeElement,fid=act&&act.id,sel=null;
 if(!VIEW_RESET)v.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(e){if(!e.readOnly&&e.type!=='password')keep[e.id]=e.value});
 try{if(fid&&act.selectionStart!=null)sel=[act.selectionStart,act.selectionEnd]}catch(e){}
 v.innerHTML=html;VIEW_RESET=false;
 Object.keys(keep).forEach(function(id){var e=$(id);if(e&&!e.hasAttribute('data-fresh'))e.value=keep[id]});
 if(fid&&$(fid)&&v.contains($(fid))){var f=$(fid);f.focus();try{if(sel)f.setSelectionRange(sel[0],sel[1])}catch(e){}}
}

async function api(path,body,tok,tries){
 var h={};if(body!==undefined)h['content-type']='application/json';if(tok)h.authorization='Bearer '+tok;
 // Zayıf mobil veride sonsuza kadar beklemesin: 20 saniyede vazgeç; okuma isteklerini bir kez yeniden dene
 var ac=typeof AbortController!='undefined'?new AbortController():null,to=ac?setTimeout(function(){ac.abort()},20000):0;
 var r;try{r=await fetch('/api/'+AREA+'/'+KOD+'/'+path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:ac?ac.signal:undefined})}catch(e){clearTimeout(to);if(body===undefined&&!tries){await new Promise(function(r){setTimeout(r,1500)});return api(path,body,tok,1)}return{status:0,d:{error:'network'}}}
 clearTimeout(to);
 var d={};try{d=await r.json()}catch(e){}
 return{status:r.status,d:d}
}
function errText(d){return ERR[d&&d.error]||ERR.server}

function kapali(d){
 if(AREA=='r')return '<div class="card badc"><h2>Online randevu şu an kapalı</h2><div class="sub">'+esc(d.ad||'Berber')+' şu anda internetten randevu almıyor. Lütfen telefonla ulaşın.</div>'+(d.tel?'<div class="acts"><a class="btn2 main" href="tel:'+esc(rakam(d.tel))+'">Ara: '+esc(d.tel)+'</a></div>':'')+'</div>';
 return '<div class="card badc"><h2>Aboneliğiniz sona erdi</h2><div class="sub">Uygulamayı kullanmaya devam etmek için lütfen ödemenizi yapın. Kayıtlarınız güvende, ödeme sonrası hemen açılır.</div>'+(d.wa?'<div class="acts"><a class="btn2 main" target="_blank" rel="noopener" href="'+esc(wa(d.wa,'Merhaba, '+(d.ad||'')+' berber aboneliğim hakkında yazıyorum.'))+'">WhatsApp’tan yazın</a></div>':'')+'</div>'}
function genelHata(st,d){
 if(st==402)return kapali(d);
 if(st==409&&d.error=='setup')return '<div class="card"><h2>Hazırlanıyor</h2><div class="sub">'+esc(d.ad||'Bu berber')+' için uygulama henüz kurulmadı. '+(AREA=='s'?'Yönetici PIN’inin sahip panelinden belirlenmesi gerekiyor.':'Lütfen daha sonra tekrar deneyin.')+'</div></div>';
 if(st==404)return '<div class="card"><h2>Berber bulunamadı</h2><div class="sub">Bu link geçersiz. Berberinizden doğru linki isteyin.</div></div>';
 return '<div class="card"><h2>Bağlanılamadı</h2><div class="sub">'+esc(errText(d))+'</div><button class="go" onclick="location.reload()">Tekrar dene</button></div>'}

/* ================= MÜŞTERİ SAYFASI (/r/<kod>) ================= */
var C={i:null,gun:'',per:'',saat:'',sira:false,slots:null,busy:false,son:null,benim:null};
function keys(){try{return JSON.parse(store('bk-'+KOD)||'{}')}catch(e){return{}}}
function keySet(id,k){var o=keys();if(k)o[id]=k;else delete o[id];store('bk-'+KOD,JSON.stringify(o))}
function cIsDk(s){return (dk(s)-dk(C.i.gunbas)+1440)%1440}
function rTarif(r){return (r.saat?gunEt(r.gun,C.i.gun)+' · saat <b>'+esc(r.saat)+'</b>':'Bugün · <b>sıra no '+r.sira+'</b>')}
function cSon(){
 var o=C.son,i=C.i;if(!o)return '';
 var m='Merhaba, '+(o.saat?gunEt(o.gun,i.gun).toLocaleLowerCase('tr-TR')+' saat '+o.saat+' için randevu aldım':'bugün sıraya girdim, sıra no: '+o.sira)+'. Ad: '+o.ad+'. Hizmet: '+o.hz+(o.per?'. Berber: '+o.per:'')+'.';
 return '<div class="card okc"><h2>'+(o.saat?'Randevunuz alındı':'Sıraya girdiniz')+'</h2>'
 +(o.saat?'<div class="big">'+esc(o.saat)+'</div><div>'+esc(gunEt(o.gun,i.gun))+' · '+fd(o.gun)+'</div>':'<div class="sub">Sıra numaranız</div><div class="big">#'+o.sira+'</div><div>Önünüzde '+o.onunde+' kişi var.</div>')
 +'<div class="sub">'+esc(o.hz)+(o.per?' · '+esc(o.per):'')+'</div>'
 +(i.wa?'<a class="btn2 ok" style="display:flex;margin-top:12px" target="_blank" rel="noopener" href="'+esc(wa(i.wa,m))+'">Salona WhatsApp’tan haber ver</a>':'')
 +'<div class="acts"><button class="btn2 bad" data-ciptal="'+esc(o.id)+'">'+(o.saat?'Randevuyu iptal et':'Sıradan çık')+'</button></div></div>'}
function cForm(){
 var i=C.i,bugun=i.gun,son=addD(bugun,i.ileri),g=C.gun;
 var h='<div class="card" id="form"><h2>Randevu al</h2>'
 +'<label for="mad">Adınız</label><input id="mad" autocomplete="name" placeholder="Örn. Mehmet Yılmaz">'
 +'<label for="mtel">Cep telefonu</label><input id="mtel" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx">'
 +'<label for="mhz">Hizmet</label><select id="mhz">'+i.hizmetler.map(function(x){return '<option value="'+esc(x.ad)+'">'+esc(x.ad)+' · '+fmt(x.fiyat)+'</option>'}).join('')+'</select>'
 +(i.personel.length>1?'<label for="mper">Berber</label><select id="mper" data-fresh><option value="">Fark etmez</option>'+i.personel.map(function(p){return '<option value="'+esc(p.id)+'"'+(C.per==p.id?' selected':'')+'>'+esc(p.ad)+'</option>'}).join('')+'</select>':'')
 +'<label for="mgun">Gün</label><div class="row"><button class="btn2" data-cgun="'+bugun+'" aria-pressed="'+(g==bugun)+'">Bugün</button><button class="btn2" data-cgun="'+addD(bugun,1)+'" aria-pressed="'+(g==addD(bugun,1))+'">Yarın</button><input id="mgun" type="date" data-fresh min="'+bugun+'" max="'+son+'" value="'+g+'" aria-label="Tarih" style="flex:1.8;padding:10px 6px"></div>'
 +'<div class="sub" style="margin-top:4px">'+esc(fd(g)+' '+wday(g))+'</div>'
 +'<label>Saat</label>';
 if(g==bugun)h+='<button class="btn2'+(C.sira?'':'')+'" data-csira="1" aria-pressed="'+C.sira+'" style="width:100%">Saat seçmeden sıraya gir (gelince sıranızla)</button>';
 if(!C.slots)h+='<div class="empty">Saatler yükleniyor…</div>';
 else{var acik=C.slots.filter(function(s){return s.ok});
  h+=acik.length?'<div class="grid">'+C.slots.map(function(s){return '<button class="btn2" data-cslot="'+s.s+'" aria-pressed="'+(!C.sira&&C.saat==s.s)+'"'+(s.ok?'':' disabled aria-label="'+s.s+' dolu"')+'>'+s.s+'</button>'}).join('')+'</div>':'<div class="empty">Bu gün için boş saat kalmadı. Başka bir gün seçin'+(g==bugun?' ya da sıraya girin':'')+'.</div>'}
 h+='<button class="go" id="cal"'+(C.busy?' disabled':'')+'>'+(C.sira?'Sıraya gir':'Randevu al')+'</button>'
 +'<div class="sub" style="margin-top:10px">Telefon numaranız yalnızca randevunuz için kullanılır.</div></div>';
 return h}
function cBenim(){
 var k=keys(),h='<div class="card"><h2>Randevularım</h2><div class="sub">Telefon numaranızı yazın, aldığınız randevuları ve sıranızı görün.</div><div class="row" style="margin-top:8px"><input id="btel" type="tel" inputmode="tel" placeholder="05xx xxx xx xx" aria-label="Telefon"><button class="btn2 main" id="bgoster" style="flex:0 0 auto">Göster</button></div>';
 if(C.benim){h+=C.benim.length?'<ul class="list" style="margin-top:8px">'+C.benim.map(function(r){
  return '<li><span>'+rTarif(r)+'<div class="sub">'+esc(r.hz)+(r.per?' · '+esc(r.per):'')+(r.durum=='geldi'?' · tamamlandı':(!r.saat&&r.durum=='bekliyor'?' · önünüzde '+r.onunde+' kişi':''))+'</div></span>'
  +(r.durum=='bekliyor'?(k[r.id]?'<button class="btn2 bad sm" data-ciptal="'+esc(r.id)+'">'+(r.saat?'İptal':'Sıradan çık')+'</button>':'<span class="sub">İptal için salonu arayın</span>'):'')+'</li>'}).join('')+'</ul>':'<div class="empty" style="margin-top:8px">Bu numarayla yaklaşan randevu yok.</div>'}
 return h+'</div>'}
function cView(){paint(cSon()+cForm()+cBenim()+(C.i.adres?'<div class="sub" style="text-align:center">'+esc(C.i.adres)+'</div>':''))}
async function cSlots(){
 var g=C.gun,r=await api('bos?gun='+g+'&per='+encodeURIComponent(C.per));
 if(g!=C.gun)return;
 if(r.status!=200){if(r.status==402){paint(kapali(r.d));return}C.slots=[];cView();toast(errText(r.d));return}

 if(id=='hkay'){var h2=hizOku();if(h2.some(function(x){return !x.ad||!(x.fiyat>0)})){toast('Her hizmet için ad ve fiyat yazın');return}if(await call('ayar',{hizmetler:h2})){VIEW_RESET=true;ciz();toast('Hizmetler kaydedildi')}return}
 if(id=='skay'){if(await call('ayar',{acilis:$('sacil').value,kapanis:$('skap').value,aralik:+$('sara').value,gunbas:$('sgb').value||'06:00'})){VIEW_RESET=true;ciz();toast('Saatler kaydedildi')}return}
 if(id=='ikay'){var iw=$('iwa').value.trim();if(iw&&!telOk(iw)){toast(ERR.bad_phone);return}if(await call('ayar',{ad:$('iad').value.trim(),wa:iw,adres:$('iadr').value.trim()})){VIEW_RESET=true;ciz();toast('Bilgiler kaydedildi')}return}
 if(id=='ynkay'){var yn=$('ynpin').value;if(!/^\d{4,8}$/.test(yn)){toast('PIN 4-8 rakam olmalı');return}if(await call('pin',{pin:yn})){VIEW_RESET=true;ciz();toast('Yönetici PIN’i değişti')}return}
 if(id=='yedek'){indir('berber-yedek-'+KOD+'-'+S.gun+'.json',JSON.stringify({shop:S.shop,randevular:S.randevular,kayitlar:S.kayitlar,giderler:S.giderler,tarih:S.gun},null,1),'application/json');return}
 if(id=='kilit'){var yt=sstore(YTK);sstore(YTK,null);if(yt)api('logout',{},yt);if(store(TK)){tab='personel';S=null;await yenile(true);toast('Yönetici bölümü kilitlendi')}else{S=null;girisEkrani()}return}
 // İşletme
 if(id=='igiris'){var ip=$('ipin').value.trim();if(!/^\d{4,8}$/.test(ip)){toast('PIN 4-8 rakam olmalı');return}var r=await api('login',{pin:ip,rol:'isl'});if(r.status!=200){toast(errText(r.d));return}sstore(ITK,r.d.token);VIEW_RESET=true;ciz();await islYukle();return}
 if(id=='ikilit'){var it=sstore(ITK);sstore(ITK,null);I=null;if(it)api('logout',{},it);ciz();toast('İşletme paneli kilitlendi');return}
 if(id=='sac'){var sa=$('sad').value.trim(),sp=$('spin').value;if(!sa){toast('Şube adını yazın');return}if(!/^\d{4,8}$/.test(sp)){toast('Şubeye 4-8 rakamlı bir yönetici PIN’i verin');return}
  var r2=await api('isl/sube',{ad:sa,kod:$('skod').value.trim(),pin:sp},sstore(ITK));if(r2.status!=200){if(r2.status==401){sstore(ITK,null);ciz()}toast(errText(r2.d));return}
  VIEW_RESET=true;await islYukle();toast(sa+' açıldı. Panel: '+link('s',r2.d.kod));return}
 // Müşteri
 if(id=='mkop'){kopya($('mlink'),'Link kopyalandı');return}
 if(id=='qrind'){indir('qr-'+KOD+'.svg',QR.svg(link('r'),600),'image/svg+xml');toast('QR indirildi');return}
 if(id=='qryaz'){window.print();return}
}

/* ================= AÇILIŞ ================= */
function landing(){
 paint('<div class="card"><h2>Berberim</h2><div class="sub">Berberinizin size verdiği linki ya da QR kodunu açın.</div><label for="kod">Berber kodu</label><div class="row"><input id="kod" autocapitalize="none" placeholder="Örn. fatih-berber"><button class="btn2 main" id="git" style="flex:0 0 auto">Aç</button></div></div>')}

document.addEventListener('click',function(ev){
 var t=ev.target.closest?ev.target.closest('button'):null;if(!t||t.disabled)return;
 if(AREA=='r'){if(C.i)cClick(t)}else if(AREA=='s')pClick(t);else if(t.id=='git'){var k=$('kod').value.trim().toLowerCase();if(k)location.href='/r/'+encodeURIComponent(k)}});
document.addEventListener('change',function(ev){var t=ev.target;
 if(AREA=='r'&&C.i){if(t.id=='mgun')cGun(t.value);if(t.id=='mper'){C.per=t.value;C.slots=null;cView();cSlots()}return}
 if(AREA!='s'||!S)return;
 if(t.id=='rgun'&&t.value){R.gun=t.value<addD(S.gun,-1)?addD(S.gun,-1):t.value;ciz()}
 if(t.id=='kper'){K.per=t.value;ciz()}
 if(t.id=='rapgun'&&t.value){rapGun=t.value>S.gun?S.gun:t.value;ciz()}});
document.addEventListener('keydown',function(ev){if(ev.key!='Enter')return;var i=ev.target.id;var m={gpin:'giris',ypin:'ygiris',ipin:'igiris',btel:'bgoster',kod:'git'};if(m[i]&&$(m[i])){ev.preventDefault();$(m[i]).click()}});
// Beklenmedik bir hata olursa "Yükleniyor"da takılmasın
function takildi(){var v=$('view');if(v&&/Yükleniyor/.test(v.textContent)&&v.children.length<2)v.innerHTML='<div class="card"><h2>Sayfa açılamadı</h2><div class="sub">İnternet bağlantınızı kontrol edip tekrar deneyin.</div><button class="go" onclick="location.reload()">Tekrar dene</button></div>'}
window.addEventListener('error',function(){setTimeout(takildi,0)});window.addEventListener('unhandledrejection',function(){setTimeout(takildi,0)});setTimeout(takildi,25000);
if(AREA=='r'&&KOD)cStart();else if(AREA=='s'&&KOD)pStart();else landing();
</script>
