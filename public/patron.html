<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34308F">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sahip">
<link rel="manifest" href="/patron.webmanifest">
<link rel="icon" href="/patron-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/patron-icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<title>Sahip Paneli</title>
<!-- Sahip paneli: uygulamayı kiralayan dükkânların aboneliği. Kayıtlar sunucuda (/api/patron). -->
<style>
:root{--bg:#EEF0F7;--card:#fff;--ink:#1B1F3B;--mute:#5E6485;--line:#DADEF0;--acc:#4B3FD6;--on:#fff;--seg:#E3E6F6;--edge:#C9CEEA;--ok:#1F7A4D;--bad:#C0392B;--warn:#B7791F;--font:Manrope,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1022;--card:#181B35;--ink:#ECEEFB;--mute:#9CA2C8;--line:#2A2E55;--acc:#8F86FF;--on:#0E1022;--seg:#22264A;--edge:#353A6B;--ok:#4CC38A;--bad:#F2796B;--warn:#E8B04F;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{border-radius:16px;padding:18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#1B1F3B 0%,#34308F 60%,#4B3FD6 120%)}
h1{font-size:26px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:#C9CDF0;font-size:14px;margin-top:4px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--seg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs:empty{display:none}
.pinrow{display:flex;gap:6px}.pinrow input{flex:1;font-size:20px;letter-spacing:.15em}
.tabs{display:flex;gap:3px;background:var(--seg);border-radius:12px;padding:4px;margin-bottom:16px;position:sticky;top:0;z-index:2}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:700 15px var(--font);padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:800;margin:0 0 6px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.go{width:100%;margin-top:16px;border:0;background:var(--acc);color:var(--on);font:800 16px var(--font);padding:13px;border-radius:10px;cursor:pointer}
.btn2{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--font);padding:10px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn2.main{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn2.warn{border-color:var(--bad);color:var(--bad);font-weight:800}
button:disabled{opacity:.6}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msgrow{display:flex;gap:6px;margin-top:10px;align-items:stretch}
.msgrow select{flex:1;padding:8px 10px}
.toast{background:var(--acc);color:var(--on);padding:10px 12px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:12px;overflow-wrap:anywhere}
.toast.err{background:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:12px}
.stat span{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.stat b{display:block;color:var(--acc);font-size:22px;line-height:1.1;font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.row>*{min-width:0}
.mute{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.st-Aktif{color:var(--ok);border-color:var(--ok)}.st-Deneme{color:var(--warn);border-color:var(--warn)}.st-Süresi{color:var(--bad);border-color:var(--bad)}.st-Durduruldu{color:var(--mute)}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.pill{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--seg);color:var(--ink);font:700 13px var(--font);padding:7px 14px;border-radius:99px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.lock{border:2px dashed var(--bad);border-radius:14px;padding:16px;text-align:center;background:var(--card)}
.todo{padding:12px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0;padding-top:6px}
.todo:last-child{padding-bottom:0}
.late{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sline{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sline:first-of-type{border-top:0}
ol.steps{margin:8px 0 0;padding-left:20px}ol.steps li{margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:right;padding:9px 6px;border-top:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mute);border-top:0}
td input{width:90px;padding:6px 8px;text-align:right}.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>SAHİP PANELİ</h1><div class="sub">Tüm dükkânların aboneliği tek yerden</div></div>
<div class="tabs" id="tabs" role="group" aria-label="Görünüm"></div>
<div id="app"><div class="card" role="status">Yükleniyor…</div></div>
</div>
<script>
'use strict';
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addDay=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const TL=n=>Math.round(n).toLocaleString('tr-TR')+' ₺';
const fd=d=>String(d||'').split('-').reverse().join('.');
const slug=t=>String(t||'').toLocaleLowerCase('tr-TR').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const SEK=['Güzellik Salonu','Bayan Kuaför','Berber','Spor Salonu','Halı Yıkama'];
const TK='patron-token';
// Oturum yalnızca bu açılışta tutulur: uygulama kapanınca ya da 5 dakika arka planda kalınca PIN yeniden sorulur
let TOKEN=null;try{localStorage.removeItem(TK);TOKEN=sessionStorage.getItem(TK)}catch(x){}
let S=null; // sunucudaki hal: today, salonlar, odemeler, paketler, ayar, subeler
let tab='s',F='Hepsi',FS='Hepsi',LK=false,MSG='',ERR=false,CONF='',EDIT='',PAY='',BK='',BUSY=false;
const today=()=>S.today;
const cf=(a,id)=>CONF===a+':'+(id||'');
const pk=id=>S.paketler.find(p=>p.id===id)||{ad:'?',fiyat:0,pers:0};
const ek=s=>{if(!s.isl)return 0;const f=S.salonlar.find(x=>x.isl&&x.isl.toLocaleLowerCase('tr-TR')===s.isl.toLocaleLowerCase('tr-TR'));return f&&f.id!==s.id?(+S.ayar.sube||0):0};
const ucret=s=>pk(s.paket).fiyat+ek(s);
const durum=s=>s.dur?'Durduruldu':s.bitis<today()?'Süresi doldu':s.deneme?'Deneme':'Aktif';
const wa=(tel,msg)=>{let t=String(tel||'').replace(/\D/g,'');if(t[0]==='0')t='90'+t.slice(1);else if(t.length===10)t='90'+t;return 'https://wa.me/'+t+'?text='+encodeURIComponent(msg)};
const adres=()=>String(S.ayar.adres||location.origin).replace(/\/+$/,'');
const HALI='Halı Yıkama';
const lnk=(s,t)=>(s.sektor===HALI?String(S.ayar.hali||'https://hali-yikama-c86.pages.dev').replace(/\/+$/,''):adres())+'/'+t+'/'+s.kod;
const haliOk=s=>(S.haliKurulu||[]).includes(s.kod);
const MS={
 hat:s=>{const k=diff(today(),s.bitis),x=s.deneme?'deneme süreniz':'aboneliğiniz';return k<0?`Merhaba, ${s.ad} ${x} ${fd(s.bitis)} tarihinde sona erdi. Devam etmek için ödemenizi yapabilirsiniz. Kayıtlarınız güvende, ödeme sonrası hemen açılır.`:`Merhaba, ${s.ad} ${x} ${fd(s.bitis)} tarihinde sona eriyor. Devam etmek için ödemenizi yapabilirsiniz.`},
 hos:s=>`Merhaba, ${s.ad} için uygulamanız hazır.\nMüşteri linkiniz: ${lnk(s,'r')}\nYönetim ve personel girişi: ${lnk(s,'s')}\nErişiminiz ${fd(s.bitis)} tarihine kadar açık. Takıldığınız yerde bana yazabilirsiniz.`,
 tes:s=>`Ödemeniz alındı, teşekkürler. ${s.ad} uygulamanız ${fd(s.bitis)} tarihine kadar aktif.`,
 kap:s=>`Merhaba, ${s.ad} uygulamasının erişimi şu an kapalı. Ödeme yapıldığında hemen açılır, kayıtlarınız güvende.`};
const MSL=[['hat','Hatırlatma'],['hos','Hoş geldin + linkler'],['tes','Ödeme teşekkürü'],['kap','Erişim kapalı']];
const $app=document.getElementById('app'),$tabs=document.getElementById('tabs');
const val=id=>(document.getElementById(id)||{value:''}).value.trim();

// --- Sunucu ---
const ERRS={reset_waiting:'Henüz onaylanmadı. Kodu ilettikten sonra birkaç dakika içinde tekrar dene.',reset_expired:'Sıfırlama kodunun süresi doldu. Yeni kod al.',reset_unknown:'Bu sıfırlama isteği bulunamadı. Yeni kod al.',same_pin:'Yönetici ve personel PIN’i aynı olamaz.',not_hali:'Bu dükkân halı yıkama değil.',wrong_pin:'PIN yanlış.',too_many:'Çok fazla yanlış deneme. 15 dakika sonra tekrar dene.',kod_taken:'Bu link kodu başka bir dükkânda var. Başka bir kod yaz.',no_name:'Dükkân adını yaz.',bad_pin:'PIN 4-8 haneli rakam olmalı.',bad_backup:'Yedek metni okunamadı. Tamamını yapıştırdığından emin ol.',network:'İnternet yok gibi. Bağlantını kontrol edip tekrar dene.'};
async function call(path,body){
 let r;
 try{r=await fetch('/api/patron/'+path,{method:body===undefined?'GET':'POST',headers:Object.assign(body===undefined?{}:{'content-type':'application/json'},TOKEN?{authorization:'Bearer '+TOKEN}:{}),body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'})}
 catch(x){throw new Error('network')}
 const d=await r.json().catch(()=>({}));
 if(r.status===401&&path!=='login'){setToken(null);S=null;throw new Error('login')}
 if(!r.ok)throw new Error(d.error||'server');
 return d}
function setToken(t){TOKEN=t;try{t?sessionStorage.setItem(TK,t):sessionStorage.removeItem(TK)}catch(x){}}
/** Sunucuda bir işlem yap, yeni hali al, ekranı yenile */
async function run(path,body,ok){
 if(BUSY)return;BUSY=true;
 try{S=await call(path,body);MSG=typeof ok==='function'?ok():ok||'';ERR=false}
 catch(x){if(x.message!=='login'){MSG=ERRS[x.message]||'Kaydedilemedi. Tekrar dene.';ERR=true}}
 BUSY=false;render()}
async function load(){
 if(!TOKEN){render();return}
 try{S=await call('state');}catch(x){if(x.message!=='login'){MSG=ERRS[x.message]||'Bilgiler yüklenemedi. Sayfayı yenile.';ERR=true}}
 render()}

// --- Görünümler ---
function formEdit(s){return `<label for="ea">Dükkân adı</label><input id="ea" value="${e(s.ad)}"><label for="es">Sektör</label><select id="es">${SEK.map(x=>`<option ${x===s.sektor?'selected':''}>${x}</option>`).join('')}</select><label for="ep">Paket</label><select id="ep">${S.paketler.map(p=>`<option value="${e(p.id)}" ${p.id===s.paket?'selected':''}>${e(p.ad)} • ${TL(p.fiyat)}/ay</option>`).join('')}</select><label for="et">Telefon (WhatsApp)</label><input id="et" type="tel" inputmode="tel" value="${e(s.tel)}"><label for="ei">İşletme sahibi (birden fazla şubesi varsa aynı adı yaz)</label><input id="ei" value="${e(s.isl)}" placeholder="Örn: Lila Grup"><label for="ek">Link kodu (uygulamadaki linkle aynı olmalı)</label><input id="ek" value="${e(s.kod)}" autocapitalize="none"><label for="eb">Bitiş tarihi</label><input id="eb" type="date" value="${e(s.bitis)}"><div class="acts"><button class="btn2 main" data-a="kay" data-id="${e(s.id)}">Kaydet</button><button class="btn2" data-a="vaz">Vazgeç</button></div>`}
function formPay(s){return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:4px"><b style="font-size:14px">Başka tutarla ödeme al</b><div class="two"><div><label for="pt">Tutar (₺)</label><input id="pt" type="number" inputmode="numeric" value="${ucret(s)}"></div><div><label for="pa">Kaç ay</label><input id="pa" type="number" inputmode="numeric" value="1" min="1"></div></div><label for="py">Yöntem</label><select id="py"><option>Havale</option><option>Kart</option><option>Nakit</option></select><div class="acts"><button class="btn2 main" data-a="ode2" data-id="${e(s.id)}">Ödemeyi kaydet</button><button class="btn2" data-a="vaz">Vazgeç</button></div></div>`}
function card(s){const d=durum(s),k=diff(today(),s.bitis),p=pk(s.paket),u=ucret(s),x=ek(s);
 const kalan=s.dur?'Erişim kapalı':k<0?Math.abs(k)+' gün önce bitti • uygulaması kapalı':k===0?'Bugün son gün':k+' gün kaldı';
 const head=`<div class="row"><div><b>${e(s.ad)}</b><div class="mute">${e(s.sektor)} • ${e(p.ad)} paket • ${TL(u)}/ay${x?' (ek şube dahil)':''}${s.isl?' • '+e(s.isl):''}</div></div><span class="chip st-${d.split(' ')[0]}">${d}</span></div><p class="mute" style="margin:8px 0 0">Bitiş: ${fd(s.bitis)} • ${kalan}</p>`;
 if(EDIT===s.id)return `<div class="card">${head}${formEdit(s)}</div>`;
 const dk=s.dur||s.bitis<today()?'kap':'hat';
 return `<div class="card">${head}
 <div class="acts"><button class="btn2" data-a="ode" data-id="${e(s.id)}" data-y="Havale">+1 ay aktif (Havale)</button><button class="btn2" data-a="ode" data-id="${e(s.id)}" data-y="Kart">+1 ay aktif (Kart)</button><button class="btn2" data-a="pay" data-id="${e(s.id)}">Başka tutar</button>${s.deneme?`<button class="btn2" data-a="den" data-id="${e(s.id)}">Deneme +7 gün</button>`:''}<button class="btn2 ${cf('dur',s.id)?'warn':''}" data-a="dur" data-id="${e(s.id)}">${s.dur?'Yeniden aç':cf('dur',s.id)?'Emin misin? Evet, durdur':'Durdur'}</button><button class="btn2" data-a="duz" data-id="${e(s.id)}">Düzenle</button><button class="btn2 ${cf('sil',s.id)?'warn':''}" data-a="sil" data-id="${e(s.id)}">${cf('sil',s.id)?'Emin misin? Evet, sil':'Sil'}</button></div>
 ${PAY===s.id?formPay(s):''}
 <div class="msgrow"><select id="m-${e(s.id)}" data-msg="${e(s.id)}" aria-label="Mesaj türü">${MSL.map(m=>`<option value="${m[0]}" ${m[0]===dk?'selected':''}>${m[1]}</option>`).join('')}</select><a class="btn2 main" id="ma-${e(s.id)}" href="${e(wa(s.tel,MS[dk](s)))}" target="_blank" rel="noopener">WhatsApp’ta aç</a></div>
 <div class="acts"><button class="btn2" data-a="kop" data-id="${e(s.id)}" data-t="r">Müşteri linkini kopyala</button><button class="btn2" data-a="kop" data-id="${e(s.id)}" data-t="s">Panel linkini kopyala</button></div>
 ${s.sektor===HALI?`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:4px"><b style="font-size:14px">Halıcı PIN’leri</b><p class="mute" style="margin:2px 0 0">${haliOk(s)?'Kurulu. Halıcı PIN’ini unutursa buradan yenisini ver.':'Henüz kurulmadı. PIN’leri belirleyince halıcının uygulaması açılır.'}</p><div class="two"><div><label for="hy-${e(s.id)}">Yönetici PIN</label><input id="hy-${e(s.id)}" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div><label for="hp-${e(s.id)}">Personel PIN</label><input id="hp-${e(s.id)}" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div><div class="acts"><button class="btn2 main" data-a="hpin" data-id="${e(s.id)}">${haliOk(s)?'PIN’leri yenile':'PIN’leri belirle'}</button></div></div>`:''}
 <label for="n-${e(s.id)}">Not</label><textarea id="n-${e(s.id)}" rows="2" data-note="${e(s.id)}" placeholder="Örn: Cuma ödeyecek, aradım">${e(s.not||'')}</textarea></div>`}
function todoRow(s,gec){const k=diff(today(),s.bitis),n=k<0?Math.abs(k)+' gün gecikti':k===0?'Bugün son gün':k+' gün kaldı';
 return `<div class="todo"><div class="row"><b>${e(s.ad)}</b>${gec?`<b>${TL(ucret(s))}</b>`:`<span class="chip ${k<0?'st-Süresi':'st-Deneme'}">${n}</span>`}</div><div class="mute">${gec?n+' • ':''}${TL(ucret(s))}${gec?'':'/ay'} • ${e(s.sektor)}${s.deneme?' • Deneme':''}${s.not?' • '+e(s.not):''}</div><div class="acts"><a class="btn2 main" href="${e(wa(s.tel,MS.hat(s)))}" target="_blank" rel="noopener">WhatsApp ile hatırlat</a><button class="btn2" data-a="ode" data-id="${e(s.id)}" data-y="Havale">Havale aldım</button><button class="btn2" data-a="ode" data-id="${e(s.id)}" data-y="Kart">Kart aldım</button></div></div>`}
function vBug(){
 const L=S.salonlar.filter(s=>!s.dur&&diff(today(),s.bitis)<=7).sort((a,b)=>a.bitis.localeCompare(b.bitis));
 const body=L.length?L.map(s=>todoRow(s,false)).join(''):'<p class="mute" style="margin:0">Bugün yapılacak iş yok. Süresi 7 gün içinde bitecek dükkân çıkınca burada görünür.</p>';
 return `<div class="card ${L.some(s=>diff(today(),s.bitis)<0)?'late':''}"><h2>Bugün yapılacaklar</h2>${body}</div>`}
function vYeniSube(){
 const kods=new Set(S.salonlar.map(s=>s.kod)),L=(S.subeler||[]).filter(b=>!kods.has(b.kod));
 if(!L.length)return '';
 return `<div class="card late"><h2>Listende olmayan şube</h2><p class="mute" style="margin:0">Uygulamada açılmış ama aboneliği takip edilmiyor. Ekleyince 14 gün deneme başlar.</p>${L.map(b=>`<div class="todo"><div class="row"><b>${e(b.ad)}</b><span class="chip">/${e(b.kod)}</span></div><div class="acts"><button class="btn2 main" data-a="ekleSube" data-k="${e(b.kod)}">Listeye ekle</button></div></div>`).join('')}</div>`}
function vSal(){
 const L=S.salonlar,aktif=L.filter(s=>durum(s)==='Aktif'),yakin=L.filter(s=>!s.dur&&s.bitis>=today()&&diff(today(),s.bitis)<=7),sorun=L.filter(s=>['Süresi doldu','Durduruldu'].includes(durum(s)));
 const gelir=aktif.reduce((t,s)=>t+ucret(s),0),fl=['Hepsi','Aktif','Deneme','Süresi doldu','Durduruldu'];
 const list=L.filter(s=>(F==='Hepsi'||durum(s)===F)&&(FS==='Hepsi'||s.sektor===FS));
 const grp={};L.forEach(s=>{if(s.isl){const k=s.isl.toLocaleLowerCase('tr-TR');(grp[k]=grp[k]||{ad:s.isl,n:0,t:0});grp[k].n++;grp[k].t+=ucret(s)}});
 const gl=Object.values(grp).filter(g=>g.n>1);
 return `${vBug()}${vYeniSube()}
 <div class="stats"><div class="stat"><span>Aktif dükkân</span><b>${aktif.length}</b></div><div class="stat"><span>Aylık beklenen gelir</span><b>${TL(gelir)}</b></div><div class="stat"><span>7 gün içinde bitecek</span><b>${yakin.length}</b></div><div class="stat"><span>Kapalı / süresi dolan</span><b>${sorun.length}</b></div></div>
 <div class="card"><h2>Sektöre göre</h2>${SEK.map(x=>{const a=aktif.filter(s=>s.sektor===x);return `<div class="sline"><span>${x} • ${L.filter(s=>s.sektor===x).length} dükkân</span><b>${TL(a.reduce((t,s)=>t+ucret(s),0))}</b></div>`}).join('')}${gl.length?`<h2 style="margin-top:14px">Birden fazla şubesi olanlar</h2>${gl.map(g=>`<div class="sline"><span>${e(g.ad)} • ${g.n} şube</span><b>${TL(g.t)}</b></div>`).join('')}`:''}</div>
 <div class="fl">${fl.map(f=>`<button class="pill" aria-pressed="${F===f}" data-a="fl" data-f="${f}">${f}</button>`).join('')}</div>
 <div class="fl">${['Hepsi'].concat(SEK).map(f=>`<button class="pill" aria-pressed="${FS===f}" data-a="fs" data-f="${f}">${f}</button>`).join('')}</div>
 ${list.map(card).join('')||'<p class="mute">Bu seçimde dükkân yok.</p>'}
 <div class="card"><h2>Yeni dükkân ekle</h2><p class="mute" style="margin:0">Yeni dükkân 14 gün ücretsiz deneme ile başlar.</p><label for="sn">Dükkân adı</label><input id="sn"><label for="ss">Sektör</label><select id="ss">${SEK.map(x=>`<option>${x}</option>`).join('')}</select><label for="sp">Paket</label><select id="sp">${S.paketler.map(p=>`<option value="${e(p.id)}">${e(p.ad)} • ${TL(p.fiyat)}/ay</option>`).join('')}</select><label for="st">Telefon (WhatsApp)</label><input id="st" type="tel" inputmode="tel"><label for="si">İşletme sahibi (birden fazla şubesi varsa)</label><input id="si" placeholder="Boş bırakabilirsin"><button class="go" data-a="ekle">Dükkânı ekle</button></div>
 <div class="card"><h2>Süresi dolan dükkân ne görür?</h2><p class="mute" style="margin:0 0 10px">Abonelik bitince ya da “Durdur” deyince dükkânın müşteri linki ve paneli bu ekranı gösterir. Kayıtları silinmez. Ödeme alınca hemen açılır.</p>${LK?`<div class="lock"><b>Aboneliğin sona erdi</b><p class="mute">Uygulamayı kullanmaya devam etmek için lütfen ödemeni yap. Kayıtların güvende, ödeme sonrası hemen açılır.</p>${S.ayar.wa?`<a class="btn2 main" href="${e(wa(S.ayar.wa,'Merhaba, aboneliğim hakkında yazıyorum.'))}" target="_blank" rel="noopener">WhatsApp’tan yaz</a>`:'<p class="mute">Bu düğme senin WhatsApp numaranı açar. Numaranı Paketler sekmesinden yaz.</p>'}</div>`:''}<button class="btn2" data-a="lk" style="margin-top:8px">${LK?'Önizlemeyi kapat':'Önizlemeyi göster'}</button></div>`}
function vOde(){
 const m=today().slice(0,7),ay=S.odemeler.filter(o=>o.t.slice(0,7)===m),top=S.odemeler.reduce((t,o)=>t+o.tutar,0);
 const gec=S.salonlar.filter(s=>!s.dur&&s.bitis<today()).sort((a,b)=>a.bitis.localeCompare(b.bitis)),borc=gec.reduce((t,s)=>t+ucret(s),0);
 const od=S.odemeler.slice().sort((a,b)=>b.t.localeCompare(a.t));
 return `<div class="stats"><div class="stat"><span>Bu ay tahsilat</span><b>${TL(ay.reduce((t,o)=>t+o.tutar,0))}</b></div><div class="stat"><span>Toplam tahsilat</span><b>${TL(top)}</b></div><div class="stat"><span>Geciken ödeme</span><b>${TL(borc)}</b></div><div class="stat"><span>Geciken dükkân</span><b>${gec.length}</b></div></div>
 <div class="card ${gec.length?'late':''}"><h2>Geciken ödemeler</h2>${gec.length?gec.map(s=>todoRow(s,true)).join(''):'<p class="mute" style="margin:0">Geciken ödeme yok.</p>'}</div>
 <div class="card"><h2>Ödemeler</h2>${od.length?od.map(o=>`<div class="todo"><div class="row"><b>${e(o.ad)}</b><b>${TL(o.tutar)}</b></div><div class="mute">${fd(o.t)} • ${e(o.y)}${o.ay>1?' • '+o.ay+' ay':''}</div><div class="acts"><button class="btn2 ${cf('geri',o.id)?'warn':''}" data-a="geri" data-id="${e(o.id)}">${cf('geri',o.id)?'Emin misin? Evet, geri al':'Geri al'}</button></div></div>`).join(''):'<p class="mute" style="margin:0">Henüz ödeme yok. Dükkânlar sekmesinde “+1 ay aktif” dediğinde burada görünür.</p>'}<p class="mute" style="margin:10px 0 0">“Geri al” ödemeyi siler. Süre, ödemeden önceki haline döner.</p></div>`}
function vPak(){return `<div class="card"><h2>PIN’i değiştir</h2><p class="mute" style="margin:0">Panele girerken sorulan PIN.</p><label for="np">Yeni PIN (6 rakam önerilir)</label><input id="np" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><label for="np2">Yeni PIN tekrar</label><input id="np2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><button class="go" data-a="pin">PIN’i değiştir</button></div>
 <div class="card"><h2>Paketler</h2><p class="mute" style="margin:0">Ücreti sen belirlersin. Yazınca kendiliğinden kaydedilir.</p><div class="scroll"><table><tr><th>Paket</th><th>Aylık ₺</th><th>Personel</th></tr>${S.paketler.map(p=>`<tr><td>${e(p.ad)}</td><td><input type="number" inputmode="numeric" value="${p.fiyat}" data-pf="${e(p.id)}" aria-label="${e(p.ad)} aylık fiyat"></td><td><input type="number" inputmode="numeric" value="${p.pers}" data-pp="${e(p.id)}" aria-label="${e(p.ad)} personel sayısı"></td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Ayarlar</h2><p class="mute" style="margin:0">Yazınca kendiliğinden kaydedilir.</p><label for="ay-sube">Ek şube ücreti (₺/ay)</label><input id="ay-sube" type="number" inputmode="numeric" value="${+S.ayar.sube||0}" data-ay="sube"><label for="ay-wa">Senin WhatsApp numaran (kapanan dükkân sana buradan yazar)</label><input id="ay-wa" type="tel" inputmode="tel" value="${e(S.ayar.wa)}" data-ay="wa" placeholder="05xx xxx xx xx"><label for="ay-adres">Uygulama adresi (linkler bundan yapılır)</label><input id="ay-adres" value="${e(S.ayar.adres)}" data-ay="adres" autocapitalize="none"><label for="ay-hali">Halı yıkama uygulamasının adresi</label><input id="ay-hali" value="${e(S.ayar.hali||'')}" data-ay="hali" autocapitalize="none"></div>
 <div class="card"><h2>Telefonun ana ekranına ekle</h2><p class="mute" style="margin:0">Tek dokunuşla açılması için:</p><ol class="steps"><li>Chrome’da bu sayfayı aç.</li><li>Sağ üstteki üç noktaya dokun.</li><li>“Ana ekrana ekle” seçeneğine dokun.</li><li>Adı “Sahip” yap, “Ekle” de.</li></ol><p class="mute" style="margin:8px 0 0">iPhone’da: Safari → Paylaş → Ana Ekrana Ekle.</p></div>
 <div class="card"><h2>Yedek</h2><p class="mute" style="margin:0">Kayıtlar zaten sunucuda güvende. İstersen ayrıca yedek al: kopyalayıp bir yere yapıştır (örn. WhatsApp’ta kendine mesaj). Gerekirse aşağıya yapıştırıp geri yüklersin.</p><div class="acts"><button class="btn2 main" data-a="yed">Yedeği kopyala</button><button class="btn2" data-a="ind">Dosya olarak indir</button></div><label for="bk">Yedek metni</label><textarea id="bk" rows="3" placeholder="Geri yüklemek için yedeği buraya yapıştır">${e(BK)}</textarea><button class="go ${cf('yuk','')?'warn':''}" data-a="yuk" style="margin-top:10px">${cf('yuk','')?'Emin misin? Şimdiki kayıtlar yedektekiyle değişir':'Yedekten yükle'}</button></div>
 <button class="btn2" data-a="cik" style="width:100%">Çıkış yap</button>`}
function render(){
 const T=MSG?`<div class="toast ${ERR?'err':''}" role="status">${e(MSG)}</div>`:'';
 if(!S){$tabs.innerHTML='';$app.innerHTML=T+(TOKEN?`<div class="card"><p style="margin-top:0">Bilgiler yüklenemedi.</p><button class="btn2" data-a="yenile">Tekrar dene</button></div>`:`<div class="card"><h2>Sahip girişi</h2><p class="mute" style="margin:0">Bu panel yalnızca sana aittir.</p><label for="pin">PIN (6 rakam)</label><div class="pinrow"><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" placeholder="••••••"><button class="btn2" data-a="goster" aria-pressed="false">Göster</button></div><button class="go" data-a="gir">Gir</button><button class="btn2" data-a="unut" style="width:100%;margin-top:10px">PIN’imi unuttum</button></div>${resetCard()}`);return}
 $tabs.innerHTML=[['s','Dükkânlar'],['o','Ödemeler'],['p','Paketler']].map(x=>`<button aria-pressed="${tab===x[0]}" data-a="tab" data-t="${x[0]}">${x[1]}</button>`).join('');
 $app.innerHTML=T+(tab==='s'?vSal():tab==='o'?vOde():vPak())}
// PIN'imi unuttum: gizli anahtar yalnızca bu telefonda durur
const RK='patron-reset';
function rget(){try{return JSON.parse(localStorage.getItem(RK)||'null')}catch(x){return null}}
function rset(v){try{v?localStorage.setItem(RK,JSON.stringify(v)):localStorage.removeItem(RK)}catch(x){}}
function resetCard(){const r=rget();if(!r)return '';return `<div class="card"><h2>PIN sıfırlama</h2><p class="mute" style="margin:0">Sıfırlama kodun:</p><p style="font-size:30px;font-weight:700;letter-spacing:.12em;margin:6px 0">${e(r.kod)}</p><p class="mute" style="margin:0">Bu kodu Claude’a yaz. Kod tek başına işe yaramaz, PIN yalnızca bu telefondan değiştirilebilir. Onaylanınca yeni PIN’i aşağıya yazıp kaydet. Kod 30 dakika geçerli.</p><label for="rp1">Yeni PIN (4-8 rakam)</label><input id="rp1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><label for="rp2">Yeni PIN tekrar</label><input id="rp2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><button class="go" data-a="rdone">Yeni PIN’i kaydet</button><button class="btn2" data-a="rvaz" style="width:100%;margin-top:10px">Vazgeç</button></div>`}
function backup(){return JSON.stringify({ayar:S.ayar,paketler:S.paketler,salonlar:S.salonlar,odemeler:S.odemeler,tarih:S.today})}
async function act(a,d){
 const key=a+':'+(d.id||''),was=CONF;CONF='';MSG='';ERR=false;
 const ask=t=>{if(was===key)return true;CONF=key;MSG=t;render();return false};
 const s=S&&S.salonlar.find(x=>x.id===d.id);
 const say=t=>{MSG=t;ERR=true;render()};
 if(a==='gir'){const pin=val('pin');if(!pin)return say('PIN’i yaz.');try{const r=await call('login',{pin});setToken(r.token);S=await call('state')}catch(x){return say(ERRS[x.message]||'Giriş yapılamadı. Tekrar dene.')}}
 else if(a==='unut'){const b=new Uint8Array(32);crypto.getRandomValues(b);const sec=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');try{const r=await call('reset-request',{secret:sec});rset({secret:sec,kod:r.kod});MSG='Sıfırlama kodun hazır. Aşağıda.'}catch(x){return say(ERRS[x.message]||'Kod alınamadı. Tekrar dene.')}}
 else if(a==='rvaz'){rset(null)}
 else if(a==='rdone'){const r=rget();if(!r)return;const n=val('rp1');if(!/^\d{4,8}$/.test(n))return say('PIN 4-8 haneli rakam olmalı.');if(n!==val('rp2'))return say('İki PIN aynı değil. Tekrar yaz.');try{const x=await call('reset-done',{secret:r.secret,pin:n});rset(null);setToken(x.token);S=await call('state');MSG='Yeni PIN kaydedildi, giriş yapıldı.'}catch(x){if(x.message==='reset_expired'||x.message==='reset_unknown')rset(null);return say(ERRS[x.message]||'Kaydedilemedi. Tekrar dene.')}}
 else if(a==='goster'){const i=document.getElementById('pin');if(i){const g=i.type==='password';i.type=g?'text':'password';const b=document.querySelector('[data-a=goster]');b.textContent=g?'Gizle':'Göster';b.setAttribute('aria-pressed',g);i.focus()}return}
 else if(a==='yenile'){await load();return}
 else if(a==='tab'){tab=d.t;EDIT='';PAY='';scrollTo(0,0)}
 else if(a==='cik'){call('logout',{}).catch(()=>{});setToken(null);S=null}
 else if(a==='fl')F=d.f;
 else if(a==='fs')FS=d.f;
 else if(a==='lk')LK=!LK;
 else if(a==='ode'&&s){return run('pay',{id:s.id,tutar:ucret(s),ay:1,y:d.y},()=>{const n=S.salonlar.find(x=>x.id===s.id);return s.ad+': 1 ay eklendi, yeni bitiş '+fd(n?n.bitis:'')+'. Uygulaması açık.'})}
 else if(a==='pay'&&s){PAY=PAY===s.id?'':s.id;EDIT=''}
 else if(a==='ode2'&&s){const t=+val('pt'),ay=Math.round(+val('pa'));if(val('pt')===''||!(t>=0))return say('Tutarı yaz.');if(!(ay>=1))return say('Ay sayısı en az 1 olmalı.');PAY='';return run('pay',{id:s.id,tutar:t,ay,y:val('py')},()=>{const n=S.salonlar.find(x=>x.id===s.id);return s.ad+': '+ay+' ay eklendi, yeni bitiş '+fd(n?n.bitis:'')+'. Uygulaması açık.'})}
 else if(a==='den'&&s){return run('trial',{id:s.id},s.ad+': deneme 7 gün uzadı.')}
 else if(a==='dur'&&s){if(!s.dur&&!ask('Durdurmak için bir daha dokun. Dükkânın uygulaması hemen kapanır.'))return;return run('stop',{id:s.id},s.ad+(s.dur?': yeniden açıldı.':': uygulaması kapatıldı. Kayıtları duruyor.'))}
 else if(a==='duz'&&s){EDIT=s.id;PAY=''}
 else if(a==='vaz'){EDIT='';PAY=''}
 else if(a==='kay'&&s){const ad=val('ea'),b=val('eb');if(!ad)return say('Dükkân adını yaz.');if(!/^\d{4}-\d{2}-\d{2}$/.test(b))return say('Bitiş tarihini seç.');const body={id:s.id,ad,sektor:val('es'),paket:val('ep'),tel:val('et'),isl:val('ei'),kod:slug(val('ek'))||slug(ad),bitis:b};BUSY=false;await run('shop',body,ad+' kaydedildi.');if(!ERR)EDIT='';render();return}
 else if(a==='sil'&&s){if(!ask('Silmek için bir daha dokun. Not: silinen dükkânın uygulaması takipsiz kalır (kapanmaz).'))return;return run('delete',{id:s.id},s.ad+' listeden silindi.')}
 else if(a==='geri'){const o=S.odemeler.find(x=>x.id===d.id);if(!o)return;if(!ask('Geri almak için bir daha dokun.'))return;return run('undo',{id:o.id},'Ödeme geri alındı, süre eski haline döndü.')}
 else if(a==='ekle'){const ad=val('sn');if(!ad)return say('Dükkân adını yaz.');return run('add',{ad,sektor:val('ss'),tel:val('st'),paket:val('sp'),isl:val('si'),kod:slug(ad)},ad+' eklendi, 14 gün deneme başladı. Link kodu: '+slug(ad))}
 else if(a==='ekleSube'){const b=(S.subeler||[]).find(x=>x.kod===d.k);if(!b)return;return run('add',{ad:b.ad,sektor:SEK[0],tel:b.tel,paket:'p1',isl:'',kod:b.kod},b.ad+' listeye eklendi, 14 gün deneme başladı.')}
 else if(a==='kop'&&s){const u=lnk(s,d.t),nm=d.t==='r'?'Müşteri':'Panel';let p;try{p=navigator.clipboard.writeText(u)}catch(x){p=Promise.reject(x)}p.then(()=>{MSG=nm+' linki kopyalandı: '+u;render()}).catch(()=>{MSG=nm+' linki: '+u+' (elle kopyala)';render()});return}
 else if(a==='yed'){const t=backup();let p;try{p=navigator.clipboard.writeText(t)}catch(x){p=Promise.reject(x)}p.then(()=>{MSG='Yedek kopyalandı. Şimdi güvenli bir yere yapıştır.';render()}).catch(()=>{BK=t;MSG='Kopyalanamadı. Aşağıdaki metni elle seçip kopyala.';render()});return}
 else if(a==='ind'){const b=new Blob([backup()],{type:'application/json'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='sahip-yedek-'+S.today+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);MSG='Yedek dosyası indirildi.'}
 else if(a==='yuk'){let o;try{o=JSON.parse(val('bk'));if(!o||!Array.isArray(o.salonlar)||!Array.isArray(o.odemeler)||!Array.isArray(o.paketler))throw 0}catch(x){return say('Yedek metni okunamadı. Tamamını yapıştırdığından emin ol.')}const t=val('bk');if(!ask('Yüklemek için bir daha dokun.'))return;BK=t;await run('restore',{yedek:o},'Yedek yüklendi.');if(!ERR)BK='';render();return}
 else if(a==='hpin'&&s){const y=val('hy-'+s.id),p=val('hp-'+s.id);if(!/^\d{4,8}$/.test(y)||!/^\d{4,8}$/.test(p))return say('PIN’ler 4-8 haneli rakam olmalı.');if(y===p)return say('Yönetici ve personel PIN’i aynı olamaz.');return run('hali-pin',{id:s.id,yon:y,per:p},s.ad+': PIN’ler kaydedildi. Halıcıya iletebilirsin.')}
 else if(a==='pin'){const n=val('np');if(!/^\d{4,8}$/.test(n))return say('PIN 4-8 haneli rakam olmalı.');if(n!==val('np2'))return say('İki PIN aynı değil. Tekrar yaz.');return run('pin',{pin:n},'PIN değişti. Bir dahaki girişte yeni PIN’i kullan.')}
 render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset)});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='pin')act('gir',{})});
let saveT=null,pend={};
function saveSettings(){clearTimeout(saveT);saveT=setTimeout(async()=>{const body=pend;pend={};try{S=await call('settings',body);MSG='Kaydedildi.';ERR=false}catch(x){MSG=ERRS[x.message]||'Kaydedilemedi. Tekrar dene.';ERR=true}const f=document.activeElement&&document.activeElement.id;render();if(f){const el=document.getElementById(f);if(el)el.focus()}},400)}
document.addEventListener('change',ev=>{const t=ev.target,n=Math.max(0,+t.value||0);if(!S)return;
 if(t.dataset.pf||t.dataset.pp){const p=S.paketler.find(x=>x.id===(t.dataset.pf||t.dataset.pp));if(p){if(t.dataset.pf)p.fiyat=n;else p.pers=n;pend.paketler=S.paketler;saveSettings()}}
 else if(t.dataset.note){const s=S.salonlar.find(x=>x.id===t.dataset.note);if(s){s.not=t.value.trim();call('note',{id:s.id,not:s.not}).then(r=>{S=r}).catch(x=>{MSG=ERRS[x.message]||'Not kaydedilemedi.';ERR=true;render()})}}
 else if(t.dataset.ay){S.ayar[t.dataset.ay]=t.dataset.ay==='sube'?n:t.value.trim();pend.ayar=Object.assign(pend.ayar||{},{[t.dataset.ay]:S.ayar[t.dataset.ay]});saveSettings()}
 else if(t.dataset.msg){const s=S.salonlar.find(x=>x.id===t.dataset.msg),a=document.getElementById('ma-'+t.dataset.msg);if(s&&a&&MS[t.value])a.href=wa(s.tel,MS[t.value](s))}});
// 5 dakikadan uzun arka planda kalırsa PIN yeniden sorulur
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}if(S&&hiddenAt&&Date.now()-hiddenAt>5*60e3){call('logout',{}).catch(()=>{});setToken(null);S=null;MSG='';EDIT='';PAY='';render()}hiddenAt=0});
// Uygulamaya geri dönünce güncel hali çek (başka cihazdan yapılan değişiklikler)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&!EDIT&&!PAY&&!BUSY&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))call('state').then(r=>{S=r;render()}).catch(()=>{})});
load();
